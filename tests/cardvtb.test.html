const SV={role:'head',net:true,ops:[],thr:5000,nid:1,uids:new Set()};
const bal=()=>SV.ops.reduce((b,o)=>b+(o.kind==='spend'?-o.amount:o.amount),0);
const state=()=>({ok:true,role:SV.role,balance:bal(),threshold:SV.thr,low:bal()<SV.thr,last_check:(SV.ops.filter(o=>o.kind==='bank_check').pop()||{}).at||null,ops:SV.ops.slice().reverse().map(o=>Object.assign({who:'Тест',mine:o.kind==='opening'?SV.role==='head':(o.kind==='spend')===(SV.role==='buyer')},o))});
async function rpc(n,b){
  if(!SV.net)throw{net:true};
  if(SV.role==='stranger')return{ok:false,error:'forbidden'};
  if(n==='ev_card_state')return state();
  if(b.p_uid&&SV.uids.has(b.p_uid))return state();
  if(n==='ev_card_add'){if((b.p_kind==='deposit'&&SV.role!=='head')||(b.p_kind==='spend'&&SV.role!=='buyer'))return{ok:false,error:'forbidden'};SV.uids.add(b.p_uid);SV.ops.push({id:SV.nid++,kind:b.p_kind,amount:b.p_amount,at:b.p_at||new Date().toISOString(),comment:null});return state()}
  if(n==='ev_card_fix'){const o=SV.ops.find(x=>x.id===b.p_op);SV.uids.add(b.p_uid);SV.ops.push({id:SV.nid++,kind:'fix',amount:o.kind==='spend'?o.amount:-o.amount,comment:'исправление №'+o.id,fixes:o.id});o.fixed=true;return state()}
  if(n==='ev_card_bank_check'){SV.uids.add(b.p_uid);SV.ops.push({id:SV.nid++,kind:'bank_check',amount:b.p_actual-bal(),actual:b.p_actual,at:new Date().toISOString()});return state()}
  if(n==='ev_card_threshold_set'){SV.thr=b.p_value;return state()}
}
</script>
