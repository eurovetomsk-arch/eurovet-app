<script src="../scripts/analytics.js"></script>
<script>
(async()=>{

ok(anTitle(D('day',{open:true,from:'2026-11-23',anchor:'2026-11-23'})).startsWith('Сегодня, 23 ноября — день не закрыт'),'сегодня: «день не закрыт, сравнения нет»');
ok(anTitle(D('week',{from:'2026-11-16',to:'2026-11-22',prev_from:'2026-11-09',prev_to:'2026-11-15',closed_through:'2026-11-22'}))==='Прошлая неделя 16–22 ноября против 9–15 ноября','неделя: «Прошлая неделя 16–22 ноября против 9–15 ноября»');
ok(anTitle(D('week',{from:'2026-11-09',to:'2026-11-15',prev_from:'2026-11-02',prev_to:'2026-11-08',closed_through:'2026-11-22'})).startsWith('Неделя 9–15 ноября против'),'другая неделя: «Неделя …»');

ok(anTitle(D('month',{from:'2026-11-01',to:'2026-11-23',prev_from:'2026-10-01',prev_to:'2026-10-23',partial:true}))==='Ноябрь, 1–23 ноября, против тех же дней: 1–23 октября','месяц: «Ноябрь, 1–23 ноября, против тех же дней: 1–23 октября»');
ok(anAltTitle(D('month',{alt_from:'2025-11-01',alt_to:'2025-11-23'}))==='Тот же период прошлого года: 1–23 ноября 2025','месяц, вторая строка: тот же период прошлого года');
ok(anTitle(D('year',{from:'2026-01-01',to:'2026-11-23',prev_from:'2025-01-01',prev_to:'2025-11-23',partial:true}))==='2026 год, 1 января – 23 ноября, против того же отрезка 2025','год: с 1 января против того же отрезка прошлого года');
ok(anTitle(D('months',{from:'2026-01-01',to:'2026-11-23'}))==='По месяцам 2026 года против тех же месяцев 2025','помесячно: подпись');
ok(anTitle(D('custom',{from:'2026-11-01',to:'2026-11-10',prev_from:'2026-10-22',prev_to:'2026-10-31'}))==='С 1 ноября по 10 ноября, против 22–31 октября','свой период: подпись');
// экран: «Итог сети», филиалы одной строкой, врачи
_rpc=async()=>D('day');AN.period='day';AN.data=null;calls.length=0;await showAnalytics();await tick();let h=analyticsHtml();
ok(h.indexOf('Итог сети')<h.indexOf('Филиалы')&&h.indexOf('Филиалы')<h.indexOf('Врачи'),'порядок: Итог сети → Филиалы → Врачи');
ok(/<small class="an-was up">было 100\s000 ₽<\/small>/.test(h)&&/<small class="an-was down">было 50<\/small>/.test(h),'«было …» крупно и цветом: зелёная при росте (выручка), красная при падении (счетов)');
ok(/an-wasd up">было 3\s898 ₽/.test(h)&&/an-wasd down">было 3\s100 ₽/.test(h),'у врача: «было …» тем же цветом (рост зелёный, падение красный)');
ok(h.includes('Выручка')&&h.includes('Счетов')&&h.includes('Средний чек')&&/120\s000 ₽/.test(h)&&h.includes('▲ +20%')&&h.includes('▼ −20%')&&/было 100\s000 ₽/.test(h),'Итог сети: три числа крупно, ▲▼ % рядом, мелко «было …»');
ok(/<details class="an-br"><summary><b>Маркса<\/b><span class="an-sline">60\s000 ₽ · чек 3\s000 ₽ · /.test(h)&&!/<details class="an-br" open/.test(h),'филиал одной строкой «выручка · чек · %», свёрнут (раскрывается нажатием)');
ok(h.includes('<b>Перелёта</b><span class="an-sline">нет данных</span>'),'филиал без данных: «нет данных»');
const docs=h.slice(h.indexOf('Врачи'));
ok(docs.indexOf('Аристова')<docs.indexOf('Иванов')&&docs.indexOf('Иванов')<docs.indexOf('Новый'),'врачи по росту среднего чека: +8% выше −3,2%, без данных в конце');
ok(/Аристова<\/b> — чек <b>4\s210 ₽<\/b> <span class="an-pct up">▲ \+8%/.test(h)&&docs.includes('Иванов &lt;b&gt;')&&!docs.includes('Иванов <b>'),'врач одной строкой «Аристова — чек 4 210 ₽ ▲ +8%», имена через esc');
ok(docs.includes('нет данных за прошлый период'),'нет данных для сравнения — серо «нет данных за прошлый период», без процента');
ok(!/partial|open|alt|block|complete/i.test(h.replace(/class="[^"]*"|data-[a-z]+="[^"]*"/g,'')),'на экране нет технических слов');
ok(h.includes('Тот же день прошлой недели: 15 ноября')&&h.includes('выручка ▲ +50%'),'мелкая строка: тот же день прошлой недели');
ok(calls.some(c=>c[0]==='ev_analytics_overview'&&c[1].p_period==='day'&&c[1].p_anchor===null&&c[1].p_from===null),'по умолчанию клиент не задаёт дату: период выбирает сервер');
// сегодня
_rpc=async()=>D('day',{open:true,from:'2026-11-23',anchor:'2026-11-23',can_next:false,network:cmp(5000,2,0,0,{revenue_pct:null,invoices_pct:null,avg_check_pct:null,clinic_complete:false})});AN.data=null;await loadAnalytics();h=analyticsHtml();
ok(h.includes('день не закрыт')&&!/▲|▼/.test(h.split('Филиалы')[0])&&/data-anact="next"[^>]*disabled/.test(h),'сегодня: «день не закрыт», без процентов, «вперёд» недоступна');
// врачи: главный вид день и неделя; в остальных свёрнуты под кнопкой
for(const pr of ['day','week']){_rpc=async()=>D(pr);AN.period=pr;AN.docsOpen=false;AN.data=null;await loadAnalytics();const hh=analyticsHtml();ok(hh.includes('Аристова')&&!hh.includes('data-anact="docs"'),'«'+pr+'»: врачи списком сразу, без кнопки')}
for(const pr of ['month','year','custom']){_rpc=async()=>D(pr);AN.period=pr;AN.custom={from:'2026-11-01',to:'2026-11-10'};AN.docsOpen=false;AN.data=null;await loadAnalytics();const hh=analyticsHtml();ok(hh.includes('Врачи ▾')&&!hh.includes('Аристова'),'«'+pr+'»: врачи свёрнуты под кнопкой «Врачи», по умолчанию закрыто')}
let bd=document.createElement('button');bd.dataset.anact='docs';S.view='an';document.body.appendChild(bd);AN.period='month';bd.click();await tick();ok(AN.docsOpen&&analyticsHtml().includes('Аристова')&&analyticsHtml().includes('Врачи ▴'),'кнопка «Врачи» раскрывает блок');
bd=document.createElement('button');bd.dataset.anact='period';bd.dataset.id='year';document.body.appendChild(bd);bd.click();await tick();ok(AN.docsOpen===false,'при смене вида блок врачей снова закрыт');
// помесячно
const MON=[{month:1,empty:false,from:'2026-01-01',to:'2026-01-31',partial:false,revenue:900000,invoices:300,avg_check:3000,prev_revenue:800000,prev_days:31,revenue_pct:12.5,invoices_pct:5,avg_check_pct:7.1,clinic_complete:true},{month:11,empty:false,from:'2026-11-01',to:'2026-11-23',partial:true,revenue:700000,invoices:210,avg_check:3333,prev_revenue:720000,prev_days:23,revenue_pct:null,invoices_pct:null,avg_check_pct:null,clinic_complete:false},{month:12,empty:true}];
_rpc=async()=>D('months',{from:'2026-01-01',to:'2026-11-23',months:MON});AN.period='months';AN.docsOpen=false;AN.data=null;await loadAnalytics();let mh=analyticsHtml();
ok(mh.includes('По месяцам')&&mh.includes('Январь')&&mh.includes('<small>1–23</small>')&&/900\s000 ₽/.test(mh)&&/было 800\s000 ₽ год назад/.test(mh)&&mh.includes('▲ +12,5%'),'помесячно: месяц, выручка, «было … год назад», ▲▼ %, текущий месяц «1–23»');
ok(/Декабрь<\/b><span class="an-ms">ещё не наступил/.test(mh)&&!mh.includes('Итог сети')&&mh.includes('Врачи ▾'),'декабрь пустой; в помесячном виде месяцы и свёрнутые врачи');
ok(mh.slice(mh.indexOf('Ноябрь')).includes('нет данных за прошлый период'),'месяц без данных год назад: серо «нет данных за прошлый период»');
// переключатель, стрелки, свой период
_rpc=async(n,b)=>D('month',{from:'2026-11-01',to:'2026-11-23',prev_from:'2026-10-01',prev_to:'2026-10-23',partial:true});
S.view='an';calls.length=0;let bt=document.createElement('button');bt.dataset.anact='period';bt.dataset.id='month';document.body.appendChild(bt);bt.click();await tick();ok(AN.period==='month'&&calls[0][1].p_period==='month'&&calls[0][1].p_anchor===null,'переключатель: месяц, дату выбирает сервер');
calls.length=0;bt=document.createElement('button');bt.dataset.anact='prev';document.body.appendChild(bt);bt.click();await tick();ok(calls[0][1].p_anchor==='2026-10-01','стрелка «назад» в месяце: 1-е число предыдущего месяца');
ok(anShift({period:'week',from:'2026-11-16',anchor:'2026-11-16'},1)==='2026-11-23'&&anShift({period:'year',from:'2026-01-01',anchor:'2026-01-01'},-1)==='2025-01-01'&&anShift({period:'day',anchor:'2026-11-22',from:'2026-11-22'},-1)==='2026-11-21','стрелки: неделя +7, год на 1 января, день ±1');
calls.length=0;_rpc=async(n,b)=>D('custom',{from:'2026-11-16',to:'2026-11-22',prev_from:'2026-11-09',prev_to:'2026-11-15'});AN.custom=null;
bt=document.createElement('button');bt.dataset.anact='period';bt.dataset.id='custom';document.body.appendChild(bt);bt.click();await tick();
ok(AN.period==='custom'&&calls.length===0&&analyticsHtml().includes('id="an-from"')&&analyticsHtml().includes('id="an-to"'),'«Свой период»: две даты «с» и «по», запрос не идёт, пока не выбраны');
const f=document.createElement('input');f.id='an-from';f.value='2026-11-16';const t2=document.createElement('input');t2.id='an-to';t2.value='2026-11-22';document.body.append(f,t2);
bt=document.createElement('button');bt.dataset.anact='apply';document.body.appendChild(bt);bt.click();await tick();
ok(calls.some(c=>c[1].p_period==='custom'&&c[1].p_from==='2026-11-16'&&c[1].p_to==='2026-11-22')&&analyticsHtml().includes('С 16 ноября по 22 ноября'),'свой период: запрос с датами и понятная подпись');
f.value='2026-11-25';t2.value='2026-11-20';bt.click();await tick();ok(AN.err&&AN.err.includes('«с» не позже «по»'),'«с» позже «по»: понятная ошибка, без запроса');
_rpc=async()=>({ok:false,error:'forbidden'});AN.period='day';AN.data=null;AN.err=null;await loadAnalytics();ok(analyticsHtml().includes('только у руководителя'),'не руководитель: сообщение');
const o=document.getElementById('o');const bad=res.filter(x=>!x[0]);o.textContent='RESULT '+(bad.length?'FAIL '+bad.map(x=>x[1]).join(' | '):'PASS')+' '+(res.length-bad.length)+'/'+res.length;
})();
