<script>

<script src="../scripts/analytics.js"></script>
<script>
(async()=>{
const res=[];const ok=(c,m)=>res.push([!!c,m]);const tick=()=>new Promise(r=>setTimeout(r,30));

const blk=(rev,inv,pr,pi)=>({revenue:rev,invoices:inv,avg_check:rev/inv,pharmacy:5000,prev_revenue:pr,prev_invoices:pi,prev_avg_check:pr/pi,prev_pharmacy:4000,revenue_pct:20,invoices_pct:-20,avg_check_pct:50,pharmacy_pct:25,days:1,prev_days:1});
const DATA={ok:true,period:'day',anchor:'2026-11-23',from:'2026-11-23',to:'2026-11-23',prev_from:'2026-11-16',prev_to:'2026-11-16',can_next:false,network:blk(120000,40,100000,50),branches:[Object.assign({id:'marksa',title:'Маркса'},blk(60000,20,50000,25)),Object.assign({id:'pereleta',title:'Перелёта'},{revenue:0,invoices:0,days:0,prev_days:0})],doctors:[{doctor_id:66,name:'Иванов <b>',revenue:30000,invoices:10,avg_check:3000,revenue_pct:12.5,avg_check_pct:-3.2},{doctor_id:7,name:'Врач №7',revenue:1000,invoices:1,avg_check:1000,revenue_pct:null,avg_check_pct:null}]};
_rpc=async(n,b)=>DATA;AN.period='day';AN.anchor='2026-11-23';await showAnalytics();await tick();

ok(/120\s000 ₽/.test(h)&&h.includes('▲ +20,0%')&&h.includes('▼ −20,0%')&&h.includes('▲ +50,0%')&&/было 100\s000 ₽/.test(h),'выручка, счета, средний чек, проценты и прошлый период');

ok(h.includes('сравнение с 16.11.2026')&&/data-anact="next"[^>]*disabled/.test(h),'подпись сравнения; «вперёд» недоступна, если период текущий');
ok(calls.some(c=>c[0]==='ev_analytics_overview'&&c[1].p_period==='day'&&c[1].p_anchor==='2026-11-23'),'запрос: ev_analytics_overview с периодом и датой');
calls.length=0;S.view='an';const b=document.createElement('button');b.dataset.anact='period';b.dataset.id='month';document.body.appendChild(b);b.click();await tick();
