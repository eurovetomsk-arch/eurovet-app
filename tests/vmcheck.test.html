<!doctype html><meta charset="utf-8"><title>RUNNING</title><body><pre id="o"></pre>
<!-- Тест клиента контроля Vetmanager (node на Mac нет). Запуск: chrome-headless-shell --headless --allow-file-access-from-files --virtual-time-budget=5000 --dump-dom file://<путь>/tests/vmcheck.test.html | grep -o '<pre id="o">[^<]*' → RESULT PASS n/n -->
<script>
const S={token:'t',view:'ctl'};let _rpc=async()=>({ok:true});async function rpc(n,b){return _rpc(n,b)}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),toast=()=>{},paint=()=>{};const BRANCHES=[{id:'70let',title:'70 лет'}];
</script>
<script src="../scripts/vmcheck.js"></script>
<script>
(async()=>{
const res=[];const ok=(c,m)=>res.push([!!c,m]);
const m=vmcMessage([{field:'cashless',verdict:'mismatch',report:5204.25,vm:8628.25}]);
ok(m.includes('В Vetmanager')&&m.includes('8')&&m.includes('628')&&m.includes('Исправьте отчёт или напишите причину'),'mismatch: «В Vetmanager X, у вас Y. Исправьте или напишите причину»');
ok(vmcMessage([{field:'total',verdict:'ok'}])==='','ok: сообщения нет');
const mh=vmcMessage([{field:'cashless',verdict:'mismatch',report:42398,vm:37045,reason:'разница равна авансу 5353,00: проверьте «Сняли с аванса» / «Положили на аванс»'}]);ok(mh.includes('разница равна авансу 5353,00')&&mh.includes('Сняли с аванса'),'баннер администратора: подсказка про аванс');
VMC.flags=[{id:8,branch:'marksa',date:'2026-11-16',field:'cashless',verdict:'mismatch',report:42398,vm:37045,diff:5353,reason:'разница равна авансу 5353,00: проверьте'}];ok(vmFlagsHtml().includes('разница равна авансу 5353,00'),'Контроль: подсказка про аванс рядом с расхождением');VMC.flags=null;
ok(vmcMessage([{field:'cashless',verdict:'mismatch',report:51635.8,vm:51435.8,reason:null}]).includes('Исправьте отчёт')&&!vmcMessage([{field:'cashless',verdict:'mismatch',report:51635.8,vm:51435.8,reason:null}]).includes('аванс'),'без подсказки: обычное сообщение');
ok(/Не удалось сверить: наличные \(ключ истёк\)/.test(vmcMessage([{field:'cash',verdict:'no_data',reason:'ключ истёк'}])),'no_data: причина показана, не «ок»');
ok(!vmcMessage([{field:'cash',verdict:'no_data',reason:'<img src=x>'}]).includes('<img'),'причина через esc');
VMC.flags=[{id:7,branch:'70let',date:'2026-11-20',field:'cashless',verdict:'mismatch',report:5204.25,vm:8628.25,diff:-3424}];
const h=vmFlagsHtml();ok(h.includes('70 лет')&&h.includes('20.11')&&h.includes('безнал')&&h.includes('data-vmact="resolve"'),'Контроль: филиал, день, поле, суммы и кнопка решения');
const fxm=vmcMessage([{field:'fix_normal',verdict:'mismatch',report:1,vm:2}]);ok(fxm.includes('В Vetmanager 2 шт., у вас 1 шт.')&&fxm.includes('фиксации животных')&&!fxm.includes('₽'),'фиксации: «В Vetmanager 2 шт., у вас 1 шт.» без рублей');
VMC.flags=[{id:5,branch:'marksa',date:'2026-11-19',field:'fix_xray',verdict:'mismatch',report:0,vm:1,diff:-1}];ok(vmFlagsHtml().includes('фиксации на R-снимке')&&vmFlagsHtml().includes('1 шт.')&&!vmFlagsHtml().includes('₽'),'Контроль: фиксации в штуках');
VMC.flags=[];VMC.acc=null;ok(vmFlagsHtml()==='','флагов нет — блока нет');
VMC.acc=[{kind:'night',key:'night:9',person_id:1,who:'Таслицкий <b>',at:'2026-11-16T18:34:00Z',detail:{after:[{action:'safe_out_add'}],money:true}},{kind:'pin',key:'pin:3:2026-11-19',person_id:3,who:'Х',at:'2026-11-19T10:00:00Z',detail:{count:3,date:'2026-11-19'}},{kind:'device',key:'device:37:ab',person_id:37,who:'Y',at:'2026-11-22T11:03:00Z',detail:{}}];
const ah=vmFlagsHtml();ok(ah.includes('Ночной вход')&&ah.includes('(деньги)')&&ah.includes('safe_out_add')&&ah.includes('Неверный PIN ×3')&&ah.includes('Новое устройство')&&ah.includes('Это я / знаю'),'Контроль входов: ночной вход с деньгами, PIN×3, новое устройство, кнопка «Это я / знаю»');
ok(!ah.includes('<b>Таслицкий <b>')&&ah.includes('&lt;b&gt;'),'имена через esc');
VMC.acc=null;
// без сети: проверка откладывается, отчёт не блокируется
localStorage.removeItem('ev_vmq');_rpc=async()=>{throw {net:true}};await vmcAfterSubmit('70let','2026-11-20',2);
ok(vmcQ().length===1&&vmcQ()[0].branch==='70let','без сети: проверка поставлена в очередь на потом');
const calls=[];_rpc=async(n,b)=>{calls.push(n);return{ok:true,queued:false}};await vmcFlushQueue();
ok(calls.includes('ev_vm_check_request')&&vmcQ().length===0,'связь вернулась: запрос проверки повторён, очередь пуста');
ok(!JSON.stringify(vmcQ()).match(/token|pin/i),'в очереди нет токена и PIN');
const o=document.getElementById('o');const bad=res.filter(x=>!x[0]);o.textContent='RESULT '+(bad.length?'FAIL '+bad.map(x=>x[1]).join(' | '):'PASS')+' '+(res.length-bad.length)+'/'+res.length;
})();
</script>
