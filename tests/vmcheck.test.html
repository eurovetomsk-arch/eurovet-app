<script src="../scripts/vmcheck.js"></script>
<script>
(async()=>{
const res=[];const ok=(c,m)=>res.push([!!c,m]);

ok(!JSON.stringify(vmcQ()).match(/token|pin/i),'в очереди нет токена и PIN');
VMC.acc=[{kind:'money',level:'red',key:'money:1',person_id:5,who:'Админ',at:'2026-11-19T20:00:00Z',detail:{action:'payroll_close'}},{kind:'pin',level:'red',key:'pin:5:2026-11-19',person_id:5,who:'Админ',at:'2026-11-19T10:00:00Z',detail:{count:6,date:'2026-11-19',brute:true}},{kind:'pin',level:'red',key:'pin:dev:ab:2026-11-19',person_id:null,who:null,at:'2026-11-19T10:00:00Z',detail:{device:true,date:'2026-11-19'}}];
