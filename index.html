<style>
:root{--bg:#f1f7f9;--card:#fff;--ink:#1d2b30;--mute:#587078;--line:#d3e2e7;--acc:#2A7D90;--acc-ink:#fff;--ok:#15803d;--okbg:#e7f5ec;--bad:#b91c1c;--badbg:#fdecec;--warn:#b45309;--warnbg:#fff4e0;--tile:#e6f0f3;--brand:#4AA0B4;--coral:#E55661}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:112px}

.pill{white-space:nowrap;flex:none}
@media (max-width:400px){.logo{width:28px;height:28px;padding:2px}header{padding:10px 12px}header .hl{gap:8px}}
.logo{width:34px;height:34px;flex:none;border-radius:50%;background:#fff;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pill{background:rgba(255,255,255,.2);color:inherit;border:0;border-radius:999px;padding:6px 10px;font-size:13px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 10px;font-size:17px}
.card h3{margin:12px 0 6px;font-size:14px;color:var(--mute);font-weight:600}
.hint{color:var(--mute);font-size:13px;margin:4px 0 8px}
.f{display:block;margin:8px 0}
.f>span{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}

.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:13px 16px;font-weight:600;min-height:48px;width:100%}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
.btn.sec{background:var(--tile);color:var(--ink);border:1px solid var(--line)}
.btn.small{width:auto;min-height:40px;padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.5}

.tile.on{border-color:var(--acc);background:var(--card);font-weight:600}
.tile small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.person{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.person>b{display:block;margin-bottom:2px}
.step{display:flex;align-items:center;gap:10px;margin:6px 0}
.step button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--tile);color:var(--ink);font-size:22px}
.step output{min-width:34px;text-align:center;font-size:20px;font-weight:600}
.step span{flex:1}
.fbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.fdet h3{font-size:15px;margin:14px 0 4px}.fdet .vr{border-left:3px solid var(--bd);padding:2px 0 2px 10px;margin:8px 0;font-size:14px}.fdet .vr small,.fdet small{color:var(--mute)}.fdet .chg{display:block;font-size:13px}.fdet{max-height:82vh;overflow-y:auto}
.chk{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;margin:6px 0;font-size:14px}
.chk.ok{background:var(--okbg);color:var(--ok)}
.chk.bad{background:var(--badbg);color:var(--bad)}
.chk.wait{background:var(--tile);color:var(--mute)}
.chk.warn{background:var(--warnbg);color:var(--warn)}
.card.pay.demo{outline:2px dashed var(--warn);outline-offset:-2px}.paysum{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}.paytot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px}.paydet>summary{cursor:pointer;font-weight:600;margin:10px 0;color:var(--mute)}.paybl{padding:6px 0 8px;border-top:1px solid var(--line)}.paybl:first-of-type{border-top:0}
.person.pc .pcrow{display:block}.pc .topay{margin:10px 0 6px;padding:10px 12px;border-radius:12px;background:var(--warnbg);border:2px solid var(--warn);display:flex;justify-content:space-between;align-items:baseline;gap:8px}.pc .topay span{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--warn)}.pc .topay b{font-size:26px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}.pc .topay.zero{background:var(--okbg);border-color:var(--ok)}.pc .topay.zero span{color:var(--ok)}.pc .topay.zero b{font-size:18px;color:var(--ok)}.pc .topay.over{background:var(--badbg);border-color:var(--bad)}.pc .topay.over span,.pc .topay.over b{color:var(--bad)}.pc .two{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);padding:0 2px}.pc .two b{font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}@media(min-width:700px){.person.pc .pcrow{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.pc .topay{margin:0;min-width:300px}}
.srow{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}.srow b{font-variant-numeric:tabular-nums;white-space:nowrap}.srow.big{font-size:17px;padding:4px 0}.srow.sub{font-size:13px;color:var(--mute)}details summary{font-size:13px;color:var(--mute);padding:6px 0;cursor:pointer}.ov .card h3{margin:14px 0 4px;font-size:16px}
.chk i{font-style:normal;font-weight:700;width:18px;flex:none}
@media (pointer:coarse){body.typing .bar{display:none}}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .st{flex:1;font-size:13px}
.bar .btn{width:auto;flex:0 0 auto;min-width:150px}
.big{font-size:18px;padding:18px 16px;text-align:left}
.toast{position:fixed;left:16px;right:16px;bottom:96px;max-width:608px;margin:0 auto;background:#222;color:#fff;border-radius:12px;padding:12px 14px;z-index:20;font-size:14px}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.ov>.card{width:100%;max-width:640px;max-height:90vh;overflow:auto;margin:0;border-radius:16px 16px 0 0}
.rm{background:none;border:0;color:var(--bad);font-size:20px;min-width:40px;min-height:46px}
.sum{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.sum[hidden]{display:none}
.sum b{font-variant-numeric:tabular-nums}
.net{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4ade80;margin-right:4px}
.net.off{background:#f87171}
pre{white-space:pre-wrap;background:var(--tile);padding:10px;border-radius:10px;font-size:13px}
/* цвет блоков: спокойная полоса слева, маленький маркер у заголовка, лёгкий оттенок фона */
.k-staff{--k0:#64788a}.k-docs{--k0:#2A7D90}.k-clinic{--k0:#2f6fa3}.k-pharm{--k0:#7b5ea7}.k-adv{--k0:#b7791f}.k-comp{--k0:#a4524b}.k-debt{--k0:#b5543a}.k-cash{--k0:#3f7d4e}.k-assist{--k0:#8a6d4b}.k-misc{--k0:#64788a}.k-check{--k0:#4b5d6b}
.card[class*=" k-"]{--k:var(--k0);border-left:5px solid var(--k);background:color-mix(in srgb,var(--k) 5%,var(--card))}
@media (prefers-color-scheme:dark){.card[class*=" k-"]{--k:color-mix(in srgb,var(--k0) 60%,#fff)}}
.card[class*=" k-"] h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--k);flex:none}
.card[class*=" k-"] .tile.on{border-color:var(--k)}
.card[class*=" k-"] .tile.on::after{content:" ✓";color:var(--k);font-weight:700}
.card h2{display:flex;align-items:center;gap:8px}
.card h2 .q{margin-left:auto}
.q{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;margin-left:6px;border-radius:50%;border:1px solid var(--line);background:var(--tile);color:var(--mute);font-size:14px;font-weight:700;line-height:1;vertical-align:middle;position:relative}
.q::after{content:"";position:absolute;top:-9px;right:-9px;bottom:-9px;left:-9px}
.f>span .q{width:22px;height:22px;font-size:12px}
#chkcard{scroll-margin-top:70px}
.bar .st[data-act]{cursor:pointer}
.chk small.need{display:block;margin-top:2px}
.ov .card h2{display:block}
/* v1.27: читаемые кнопки — основная сплошная, вторичная с контуром, опасная красная, выбранная плитка залита цветом блока */
:root{--bd:#8fb0ba;--onk:#fff}
@media (prefers-color-scheme:dark){:root{--bd:#5b7f89;--onk:#06262d}}
.btn{box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.sec{background:var(--card);color:var(--acc);border:2px solid var(--acc);box-shadow:none}
.btn.sec[data-act=ovclose],.btn.sec[data-act=logout],.btn.sec[data-act=back],.btn.sec[data-act=salback]{color:var(--ink);border-color:var(--bd)}
.btn.small[data-act=salgo],.btn.small[data-act=setReason]{box-shadow:0 1px 0 rgba(0,0,0,.18)}
[data-act=delOther],[data-act=delExp],[data-act=salcancel],[data-act=clearDraft]{background:var(--card)!important;color:var(--bad)!important;border:2px solid var(--bad)!important}
.tile{background:var(--card);border:2px solid var(--bd)}
.tile.on{border-color:var(--acc);background:var(--acc);color:var(--acc-ink);font-weight:700}
.tile.on small{color:var(--acc-ink);opacity:.85}
.card[class*=" k-"] .tile.on{border-color:var(--k);background:var(--k);color:var(--onk)}
.card[class*=" k-"] .tile.on::after{content:" ✓";color:var(--onk);font-weight:700}
.card[class*=" k-"] .tile.on small{color:var(--onk)}
.pill{background:var(--acc-ink);color:var(--acc);font-weight:700}
@media (max-width:340px){.bar .in{gap:6px}.bar .btn{min-width:0;padding:13px 12px}.bar .st{font-size:12px;min-width:0}}
.step button{background:var(--card);border:2px solid var(--acc);color:var(--acc);font-weight:700}

/* v1.28: инструкция внутри приложения */
.hs{margin:0 0 18px;padding:0 0 14px;border-bottom:1px solid var(--line)}
.hs:last-of-type{border-bottom:0}
.hs h3{font-size:18px;color:var(--acc);margin:0 0 6px;line-height:1.25}
.hs p{margin:0 0 8px;font-size:16px;line-height:1.45}
.hs ul{margin:6px 0;padding-left:20px;font-size:16px;line-height:1.45}.hs li{margin:0 0 6px}
.hs img{display:block;width:100%;max-width:420px;margin:8px auto;border:1px solid var(--line);border-radius:10px}
.hl2{list-style:none;padding:0;margin:8px 0;font-size:16px;line-height:1.4}
.hl2 li{display:flex;gap:10px;margin:0 0 8px;align-items:flex-start}
.hl2 b{flex:0 0 26px;height:26px;border-radius:50%;background:#d6193c;color:#fff;text-align:center;line-height:26px;font-size:14px}
.htip{background:var(--warnbg);border-left:5px solid var(--warn);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:15px}
.hchk{list-style:none;padding-left:0!important}.hchk li::before{content:"☐ ";font-size:18px}/*HELPCSS_END*/

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--card);color:var(--ink);border:2px solid var(--bd,var(--line));border-radius:999px;padding:8px 13px;font-size:14px;min-height:40px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.chips.tabs .chip{flex:1 1 auto;text-align:center}
.srch{width:100%;margin:8px 0;padding:10px 12px;border:2px solid var(--bd,var(--line));border-radius:12px;font-size:16px;background:var(--card);color:var(--ink)}
.pernav{display:flex;align-items:center;gap:8px;margin:6px 0}
.pernav .chip{min-width:48px;font-size:22px;padding:4px 12px}
.pernav .chip:disabled{opacity:.35}
.perlab{flex:1;text-align:center;line-height:1.25}

.hrow{display:flex;justify-content:space-between;width:100%;min-height:44px;align-items:center;background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 4px;font-size:15px;color:var(--ink)}
.hrow.on{font-weight:700}
.person.done{opacity:.65}
.wktabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.wktabs .chip{display:flex;flex-direction:column;align-items:flex-start;gap:0;border-radius:14px;padding:8px 12px;font-size:13px;min-height:48px}
.wktabs .chip b{font-size:15px}
.nv{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}

@media (pointer:coarse){body.typing .nv{display:none}}
button.srow.grow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;text-align:left;padding:10px 0;font-size:16px;min-height:44px}
button.person.revrow{display:block;width:100%;text-align:left;background:var(--card);color:inherit}

<script>
(()=>{
'use strict';
/* ====== Настройки (публичные по замыслу: доступ к данным только через функции с PIN) ====== */

function num(s){ // null — пусто; NaN — некорректно
  if(s==null)return null;
  const t=String(s).replace(/[\s ]/g,'').replace(',','.');
  if(t==='')return null;
  if(!/^-?\d+(\.\d{0,2})?$/.test(t))return NaN;
  return Number(t);
}
function fmtNum(s){ // пробелы между тысячами: 12 332,50 (хранится как введено, разбор — num())
  let v=String(s==null?'':s);const neg=v.trim().charAt(0)==='-';
  v=v.replace(/[^\d.,]/g,'');
  const m=v.search(/[.,]/);
  let ip=m<0?v:v.slice(0,m),dp=m<0?'':v.slice(m+1).replace(/[^\d]/g,'').slice(0,2);
  const sep=m<0?'':v.charAt(m);
  ip=ip.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0');
  return (neg?'-':'')+ip+(m<0?'':sep+dp);
}
const N=s=>{const v=num(s);return(v==null||isNaN(v))?0:v};

async function rpc(name,body,ms,ref){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms||20000);if(ref)ref.c=ctl;
  let r;
  try{
    r=await fetch(CFG.url+'/rest/v1/rpc/'+name,{method:'POST',headers:{'apikey':CFG.key,'Authorization':'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});
  }catch(e){throw{net:true}}finally{clearTimeout(t)}
  if(r.status>=500)throw{net:true,status:r.status};
  if(!r.ok)throw{http:r.status};
  return r.json();
}

const isRet=a=>a==='Возврат клиника'||a==='Возврат аптека';
const isNcRet=e=>isRet(e.article)&&e.method==='noncash';
/* ====== Проверки (только подсвечивают, числа никогда не правят) ====== */
function compute(){
  const f=S.form,c=S.ctx;
  const sumDocs=r2(Object.values(f.doctors).reduce((a,d)=>a+N(d.val),0)+f.others.reduce((a,o)=>a+N(o.val),0));
  const total=N(f.total),cash=N(f.cash),cashless=N(f.cashless);
  const phv=N(f.ph_val),phc=N(f.ph_cash),phn=N(f.ph_cashless);
  const exp=r2(f.expenses.filter(e=>!isNcRet(e)).reduce((a,e)=>a+N(e.amount),0));
  const expNc=r2(f.expenses.filter(isNcRet).reduce((a,e)=>a+N(e.amount),0));
  const comp=N(f.comp),cert=N(f.cert),nc=r2(comp+cert);
  const open=N(f.open);
  /* v1.45: с 29.10 «нал» и «безнал» — факт денег за день (касса и терминал), аванс принят/списан отдельно */
  const advNew=S.date>='2026-10-29';
  const advc=advNew?0:N(f.adv_cash);
  const advAdj=advNew?r2(N(f.adv_cash)+N(f.adv_cashless)-N(f.adv_out)):0;
  const expected=r2(open-exp+cash+phc+advc-nc);
  const checks=[];
  const add=(id,label,diff,ready,detail,miss='')=>checks.push({id,label,ready,diff:r2(diff),ok:ready&&Math.abs(diff)<=CFG.tol,detail,miss});
  const ms=a=>a.filter(Boolean).join(', ');
  add('docs','Сумма врачей = Клиника общая',sumDocs-total,f.total!==''&&(Object.keys(f.doctors).length>0||f.others.length>0),'врачи '+money(sumDocs)+' vs общая '+money(total),
    ms([f.total===''&&'«Клиника общая»',!(Object.keys(f.doctors).length>0||f.others.length>0)&&'отметьте врачей и введите их вал']));
  const repaid=N(f.repaid);
  add('pay','Нал + безнал'+(advNew?' − аванс принят + аванс списан':'')+(repaid>0?' − погашенный долг':'')+' = Клиника общая',cash+cashless-repaid-advAdj-total,f.total!==''&&(f.cash!==''||f.cashless!==''),'нал '+money(cash)+' + безнал '+money(cashless)+(advNew?' − аванс принят '+money(N(f.adv_cash)+N(f.adv_cashless))+' + списан '+money(N(f.adv_out)):'')+(repaid>0?' − погашение долга '+money(repaid):'')+' vs общая '+money(total),
    ms([f.total===''&&'«Клиника общая»',(f.cash===''&&f.cashless==='')&&'«Нал» и «Безнал»']));
  const phAny=f.ph_val!==''||f.ph_cash!==''||f.ph_cashless!=='';
  add('pharm','Аптека: нал + безнал = вал аптеки',phc+phn-phv,phAny,'нал '+money(phc)+' + безнал '+money(phn)+' vs вал '+money(phv),
    'вал, нал и безнал аптеки (если аптека не работала, оставьте пустыми — пункт можно не учитывать)');
  add('box','Итог инкассации = начало − расходы + нал (клиника+аптека) + аванс наличными − компенсации и сертификаты',N(f.close)-expected,f.close!==''&&f.open!=='','по расчёту '+money(expected)+(advc||nc?' (аванс наличными '+money(advc)+(nc?', без денег −'+money(nc):'')+')':'')+', введено '+money(N(f.close)),
    ms([f.open===''&&'«Начальная инкассация»',f.close===''&&'«Итог инкассации» (сколько наличных в кассе)']));
  if(nc>0)add('nc','Компенсации и сертификаты не больше нал + аванс наличными',Math.max(0,nc-(cash+phc+advc)),true,'без денег '+money(nc)+' vs нал клиники+аптеки+аванс '+money(cash+phc+advc));
  const prev=c&&c.prev&&c.prev.closing!=null?Number(c.prev.closing):null;
  if(prev!=null)add('prev','Начало = итог за '+ruDate(c.prev.date),open-prev,f.open!=='','вчера итог '+money(prev)+', введено начало '+money(open),'«Начальная инкассация»');
  return{checks,sumDocs,exp,expNc,expected,total,cash,cashless};
}

function validate(){
  const f=S.form,errs=[];
  const need=(k,l)=>{const v=num(f[k]);if(v==null||isNaN(v))errs.push(l)};
  if(!Object.keys(f.admins).length)errs.push('Отметьте, кто работал администратором');
  need('total','«Клиника общая»');need('cash','«Нал клиники»');need('cashless','«Безнал клиники»');need('open','«Начальная инкассация»');need('close','«Итог инкассации»');
  const LBL={ph_val:'Вал аптеки',ph_cash:'Нал аптеки',ph_cashless:'Безнал аптеки',adv_cash:'Аванс принят наличными',debt:'Долг клиентов',repaid:'Погашен прошлый долг',adv_cashless:'Аванс принят безналично',adv_out:'Аванс списан',comp:'Компенсация клиенту',cert:'Оплата сертификатом'};
  Object.keys(LBL).forEach(k=>{if(isNaN(num(f[k])))errs.push('Некорректное число в поле «'+LBL[k]+'»')});
  Object.entries(f.doctors).forEach(([id,d])=>{const v=num(d.val);if(v==null||isNaN(v))errs.push('Не заполнен вал врача: '+(docName(id)||id))});
  f.others.forEach((o,i)=>{const v=num(o.val);if(!o.title.trim()||v==null||isNaN(v))errs.push('Строка «не из списка» №'+(i+1)+': нужно название и сумма')});
  f.expenses.forEach((e,i)=>{const v=num(e.amount);if(!e.article||v==null||isNaN(v))errs.push('Расход №'+(i+1)+': выберите статью и введите сумму');
    if(isRet(e.article)&&e.method!=='cash'&&e.method!=='noncash')errs.push('Расход №'+(i+1)+': выберите, как вернули деньги — наличными или безналично');
    if(e.article==='Другое'&&(e.comment||'').trim().length<3)errs.push('Расход №'+(i+1)+' «Другое»: напишите в комментарии, на что потрачено')});
  if((N(f.comp)>0||N(f.cert)>0)&&!(f.nc_comment||'').trim())errs.push('Компенсация / сертификат: укажите причину (без ФИО клиента)');
  Object.entries(f.assistants).forEach(([k,a])=>{if(!isFinite(a.fn)||!isFinite(a.fx))errs.push('Фиксации ассистента')});
  const calc=compute();
  const red=calc.checks.filter(c=>c.ready&&!c.ok);
  if(red.length&&!f.diff_reason.trim())errs.push('Есть расхождения — напишите причину внизу формы');
  if(S.ctx.current&&f.corr_reason.trim().length<3)errs.push('Отчёт уже сдан — укажите причину исправления');
  return{errs,calc,red};
}
const aNm=n=>String(n==null?'':n).replace(/\s+[А-ЯЁ]\.(?:\s?[А-ЯЁ]\.)?$/,'');
const docName=id=>{const d=S.ctx&&S.ctx.doctors.find(x=>String(x.id)===String(id));return d&&d.name};

function buildData(calc){
  const f=S.form,c=S.ctx;
  const byId=(arr,id)=>arr.find(x=>String(x.id)===String(id));
  const admins=Object.keys(f.admins).map(id=>({id:Number(id),name:(byId(c.admins,id)||{}).name,left:f.admins[id].left||null,came:f.admins[id].came||null}));
  const doctors=Object.keys(f.doctors).map(id=>{const d=byId(c.doctors,id)||{};return{id:Number(id),name:d.name,vm_id:d.vm_id,val:N(f.doctors[id].val)}});
  const assistants=Object.keys(f.assistants).map(k=>{const[role,id]=k.split(':');const a=c.assistants.find(x=>x.role===role&&String(x.id)===id)||{};const v=f.assistants[k];
    return{id:Number(id),name:aNm(a.name),role,fix_normal:v.fn|0,fix_xray:v.fx|0,left:v.left||null,came:v.came||null}});
  return{
    schema:1,app:CFG.appVer,branch:S.branch,date:S.date,
    admins,doctors,
    others:f.others.map(o=>({title:o.title.trim(),val:N(o.val)})),
    total:N(f.total),cash:N(f.cash),cashless:N(f.cashless),
    pharmacy:{val:N(f.ph_val),cash:N(f.ph_cash),cashless:N(f.ph_cashless)},
    cashbox:{opening:N(f.open),
      expenses:f.expenses.map(e=>({article:e.article,amount:N(e.amount),comment:(e.comment||'').trim()||null,method:isRet(e.article)?e.method:'cash'})),
      closing:N(f.close),expected_closing:calc.expected,prev_closing:(c.prev&&c.prev.closing!=null)?Number(c.prev.closing):null},
    assistants,
    fix_totals:{normal:assistants.reduce((a,x)=>a+x.fix_normal,0),xray:assistants.reduce((a,x)=>a+x.fix_xray,0)},
    debt:f.debt===''?null:N(f.debt),debt_comment:(f.debt_comment||'').trim()||null,debt_repaid:f.repaid===''?null:N(f.repaid),
    advance_cash:f.adv_cash===''?null:N(f.adv_cash),advance_cashless:f.adv_cashless===''?null:N(f.adv_cashless),advance_out:f.adv_out===''?null:N(f.adv_out),
    noncash:(N(f.comp)>0||N(f.cert)>0)?{bonus:N(f.comp),certificate:N(f.cert),comment:(f.nc_comment||'').trim()}:null,
    note:f.note.trim()||null,diff_reason:f.diff_reason.trim()||null,
    checks:calc.checks.filter(x=>x.ready).map(x=>({id:x.id,ok:x.ok,diff:x.diff}))
  };
}

/* ====== Отправка и очередь ====== */
let flushing=false,wantAgain=false;const flushRef={c:null};
async function flush(auto){
  if(flushing||!S.queue.length)return;
  if(!S.token){if(!auto)render();return} // 1.64: фоновая отправка без входа НЕ перерисовывает экран входа (раньше раз в 8 с стирала PIN)
  flushing=true;
  const sig=()=>S.queue.map(x=>x.uid+(x.status==='new'?'offline':x.status)).join()+S.online;const sig0=sig();
  try{
    for(const it of S.queue.slice()){
      if(it.status==='needs_reason')continue;
      if(auto&&it.status==='error')continue; // ошибки сервера сами не повторяем, только по кнопке
      let res;
      try{
        res=await rpc('ev_submit',{p_token:S.token,p_branch:it.branch,p_date:it.date,p_data:it.data,p_device:DEV,p_client_time:it.client_time,p_client_uid:it.uid,p_reason:it.reason||null},12000,flushRef);
      }catch(e){
        if(e.net){it.status='offline';if(S.online){S.online=false;setHeader()}break}
        it.status='error';it.err='HTTP '+e.http;continue;
      }
      if(!S.online){S.online=true;setHeader()}
      if(res.ok){
        S.queue=S.queue.filter(x=>x.uid!==it.uid);saveQueue();
        if(S.done&&S.done.uid===it.uid){S.done.sent=true;S.done.version=res.version||S.done.version;S.flags=null;loadFlags(it.branch,it.date)}
      }else if(res.error==='session'){
        S.token=null;LS.del('ev_token');S.view='login';it.status='need_login';break;
      }else if(res.error==='reason_required'){it.status='needs_reason'}
      else if(res.error==='conflict'){it.status='offline'}
      else{it.status='error';it.err=res.error==='date_range'?'дата старше 7 дней, такой отчёт подать нельзя, напишите руководителю':res.error==='window_closed'?'Время правки вышло (до 12:00 следующего дня). Напишите руководителю':res.error}
    }
  }finally{
    flushing=false;saveQueue();
    // автоповтор не должен перерисовывать форму, пока человек печатает: рисуем только если что-то изменилось
    if(!auto||sig()!==sig0)render();
    if(wantAgain){wantAgain=false;setTimeout(()=>{resetOffline();flush()},300)}
  }
}
function resetOffline(){S.queue.forEach(x=>{if(x.status==='offline')x.status='new'})}
// «пнуть» отправку: вернулась связь, приложение снова на экране, нажата кнопка
function kick(){
  if(!S.queue.length)return;
  if(flushing){wantAgain=true;try{flushRef.c&&flushRef.c.abort()}catch(e){}return}
  resetOffline();flush();
}

async function submit(){
  const v=validate();
  if(v.errs.length){toast(v.errs[0],5000);return}
  const data=buildData(v.calc);
  const it={uid:uid(),branch:S.branch,date:S.date,data,reason:S.ctx.current?S.form.corr_reason.trim():null,
    client_time:new Date().toISOString(),status:'new',branchTitle:(BRANCHES.find(b=>b.id===S.branch)||{}).title,
    summary:summaryText(data)};
  S.queue.push(it);
  if(!saveQueue()){toast('Не удалось сохранить на устройстве! Скопируйте итоги вручную.',8000)}
  LS.del(draftKey());
  S.done={uid:it.uid,sent:false,version:null,summary:it.summary,branch:it.branchTitle,date:S.date};
  S.view='done';render();
  await flush();
}

function summaryText(d){
  const L=[];const bt=(BRANCHES.find(b=>b.id===d.branch)||{}).title;
  L.push('ЕВРОВЕТ '+bt+' — '+ruDate(d.date));
  L.push('Админ: '+d.admins.map(a=>a.name+(a.came?' (пришёл '+a.came+')':'')+(a.left?' (ушёл '+a.left+')':'')).join(', '));
  d.doctors.forEach(x=>L.push(x.name+': '+x.val));
  d.others.forEach(x=>L.push(x.title+': '+x.val));
  L.push('Клиника общая: '+d.total);L.push('Нал: '+d.cash+'  Безнал: '+d.cashless);
  L.push('Аптека: вал '+d.pharmacy.val+', нал '+d.pharmacy.cash+', безнал '+d.pharmacy.cashless);
  L.push('Инкасс. начало: '+d.cashbox.opening);
  d.cashbox.expenses.forEach(e=>L.push('Расход '+e.article+': '+e.amount+(isRet(e.article)?(e.method==='noncash'?' безналично (из кассы не вычитается)':' наличными'):'')+(e.comment?' ('+e.comment+')':'')));
  if(d.debt>0||d.debt_repaid>0)L.push('Долги клиентов: не оплачено '+(d.debt||0)+(d.debt_comment?' ('+d.debt_comment+')':'')+', погашено прошлых '+(d.debt_repaid||0));
  if(d.noncash)L.push('Без денег в кассе: компенсации '+d.noncash.bonus+', сертификаты '+d.noncash.certificate+' ('+d.noncash.comment+')');
  if(d.advance_cash!=null||d.advance_cashless!=null||d.advance_out!=null)L.push('Аванс: принят нал '+(d.advance_cash||0)+', безнал '+(d.advance_cashless||0)+', списан '+(d.advance_out||0));
  L.push('Инкасс. итог: '+d.cashbox.closing);
  d.assistants.forEach(a=>L.push('Ассистент '+aNm(a.name)+': фикс. '+a.fix_normal+', рентген '+a.fix_xray+(a.came?', пришёл '+a.came:'')+(a.left?', ушёл '+a.left:'')));
  if(d.note)L.push('Примечание: '+d.note);
  if(d.diff_reason)L.push('Причина расхождений: '+d.diff_reason);
  return L.join('\n');
}

async function loadLoginList(){
  try{const l=await rpc('ev_login_list',{});if(Array.isArray(l)){S.loginList=l;LS.set('ev_loginlist',l)}}catch(e){}
}
async function doLogin(pin){
  if(!S.pick){toast('Выберите себя в списке');return}
  if(!/^\d{6}$/.test(pin)){toast('PIN — 6 цифр');return}
  S.busy=true;render();
  try{
    const r=await rpc('ev_login',{p_person:S.pick,p_pin:pin,p_device:DEV});
    if(r.ok){S.token=r.token;S.person=r.person;LS.set('ev_token',r.token);touchAct();LS.set('ev_person',r.person);LS.set('ev_last',r.person.id);S.busy=false;if(ccOnly()||(isCC()&&loginTab()==='cc')){showCC();return}if(workOnly()){showWork();return}S.view='branch';render();flush();return}
    const m={bad_pin:'Неверный PIN'+(r.attempts_left!=null?'. Осталось попыток: '+r.attempts_left:''),locked:'Слишком много ошибок. Вход закрыт на 15 минут.',expired:'Срок PIN истёк — обратитесь к руководителю.',no_access:'Нет доступа. Обратитесь к руководителю.'};
    toast(m[r.error]||'Ошибка входа',6000);
  }catch(e){toast(e.net?'Нет связи с сервером. Проверьте интернет.':'Ошибка сервера ('+e.http+')',6000)}
  S.busy=false;render();
}
function logout(){S.sch=null;S.token=null;S.person=null;S.form=null;S.ctx=null;S.sal=null;S.rev=null;S.revSal=null;S.ctl=null;S.salTab=null;S.salPay=null;S.salPayKey=null;S.salPayErr=null;S.salPayLoad=false;S.revBranch=null;S.cc=null;S.mySal=null;S.work=null;S.wkAdm=null;S.wkHist=false;S.wkHistData=null;S.pay=null;S.day=null;LS.del('ev_token');LS.del('ev_person');S.view='login';render();loadLoginList().then(()=>{if(S.view==='login')render()})}

async function openBranch(id){
  S.branch=id;S.busy=true;render();
  let ctx=null;S.ctxOffline=false;
  try{
    const t0=Date.now();
    try{ctx=await rpc('ev_context',{p_token:S.token,p_branch:id,p_date:S.date},8000)}
    catch(e1){if(!e1.net||Date.now()-t0>3000)throw e1;ctx=await rpc('ev_context',{p_token:S.token,p_branch:id,p_date:S.date},6000)} // быстрый сбой сети — одна повторная попытка; зависание не удваиваем
    if(!ctx.ok){
      if(ctx.error==='session'){S.busy=false;S.token=null;LS.del('ev_token');S.view='login';toast('Сессия закончилась. Войдите заново.');render();return}
      toast('Ошибка: '+ctx.error);S.busy=false;render();return;
    }
    {const keep=Object.assign({},ctx);keep.prev=null;keep.current=null;LS.set('ev_ctx:'+id,keep)} // в запас — только списки; остаток и сданный отчёт не храним
  }catch(e){
    if(!e.net){toast('Ошибка сервера ('+e.http+')');S.busy=false;render();return}
    ctx=LS.get('ev_ctx:'+id);
    if(!ctx){toast('Нет связи, и для этого филиала нет сохранённого списка. Подключитесь к интернету.',7000);S.busy=false;render();return}
    S.ctxOffline=true;
    ctx.current=null;ctx.prev=null; // сданные версии и вчерашний остаток без связи неизвестны — не подставляем чужое/старое
  }
  S.ctx=ctx;
  const draft=LS.get(draftKey());
  S.draftTs=null;
  if(draft&&draft.form){S.form=Object.assign(emptyForm(),draft.form);S.draftTs=draft.ts||Date.now()}
  else if(ctx.current){S.form=formFromReport(ctx.current.data)}
  else S.form=freshForm();
  S.busy=false;S.view='form';S.flags=null;render();
  if(ctx.current&&!S.ctxOffline)loadFlags(id,S.date);
}

  h.innerHTML='<div class="hl"><img class="logo" src="mark.svg" alt=""><div><b>'+esc(S.person?S.person.name:'')+'</b><small>'+(S.view==='form'&&bt?esc(bt)+' · '+ruDate(S.date):'Мой ЕВРОВЕТ')+'</small></div></div><div class="hb">'+netBadge()+

function openHelp(){closeOv();S.helpFrom=S.view==='help'?(S.helpFrom||'login'):S.view;S.view='help';render();window.scrollTo(0,0)}

const LCATS=[['head','Руководитель'],['adm','Администратор'],['asst','Ассистент'],['doc','Врач'],['cc','Колл-центр'],['oth','Другие']];
const inCat=(p,c)=>{
  if(c==='head')return p.head===true; // 1.66: отдельный вход руководителя (флаг head отдаёт ev_login_list после миграции ev_v155)
  if(!('doc' in p)&&(c==='doc'||c==='asst'||c==='oth')) return c==='doc'&&p.work===true&&p.adm!==true&&p.cc!==true; // список со старой страницы 1.46: врачи и ассистенты вместе
  return c==='adm'?p.adm===true:c==='cc'?p.cc===true:c==='doc'?p.doc===true:c==='asst'?p.asst===true:p.cour===true;
};
function loginCats(){return LCATS.filter(c=>S.loginList.some(p=>inCat(p,c[0])))}
function loginRole(){ // выбранная или запомненная на устройстве роль (только слово, ни PIN, ни сумм)
  const cs=loginCats().map(c=>c[0]);
  if(S.loginTab&&cs.includes(S.loginTab))return S.loginTab;
  const t=LS.get('ev_tab');return cs.includes(t)?t:null;
}
const loginTab=loginRole;
function pinForm(){
  return '<label class="f"><span>PIN (6 цифр)</span><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]*"></label>'
    +'<button class="btn" data-act="login"'+(S.busy?' disabled':'')+'>'+(S.busy?'Входим…':'Войти')+'</button>';
}
function viewLogin(){
  if(!S.loginList.length)return '<div class="card"><h2>Вход</h2><p class="hint">Список сотрудников не загружен. Проверьте интернет и обновите страницу.</p></div>';
  const cats=loginCats(),chosen=S.loginTab&&cats.some(c=>c[0]===S.loginTab)?S.loginTab:null;
  const last=S.loginList.find(p=>String(p.id)===String(LS.get('ev_last'))),lr=loginRole();
  let h;
  if(chosen){ // шаг 2: фамилия и PIN
    const list=S.loginList.filter(p=>inCat(p,chosen)),cn=(cats.find(c=>c[0]===chosen)||[])[1]||'';
    if(S.pick!=null&&!list.some(p=>String(p.id)===String(S.pick)))S.pick=null;
    h='<div class="card"><button class="btn sec small" data-act="ltab" data-t="" style="margin:0 0 10px">← Назад</button><h2>'+esc(cn)+': выберите себя</h2>';
    h+='<div class="tiles">'+list.map(p=>'<button class="tile'+(String(S.pick)===String(p.id)?' on':'')+'" data-act="pick" data-id="'+p.id+'">'+esc(p.name)+'</button>').join('')+'</div>';
    h+=pinForm()+'</div>';
  }else if(last&&lr&&!S.notMe&&inCat(last,lr)){ // быстрый вход: запомнены только фамилия и роль
    S.pick=last.id;
    h='<div class="card"><h2>Здравствуйте!</h2><p class="hint" style="margin:0 0 8px">Это вы — '+esc(last.name)+'?</p>'+pinForm()
      +'<button class="btn sec" style="margin-top:10px" data-act="notme">Это не я</button></div>';
  }else{ // шаг 1: роль
    h='<div class="card"><h2>Здравствуйте! Кто вы?</h2>';
    h+=cats.filter(c=>['adm','asst','doc'].includes(c[0])).map(c=>'<button class="btn big" style="margin:8px 0" data-act="ltab" data-t="'+c[0]+'">'+c[1]+'</button>').join('');
    h+=cats.filter(c=>c[0]==='cc').map(c=>'<button class="btn sec big" style="margin:8px 0" data-act="ltab" data-t="cc">'+c[1]+'</button>').join('');
    h+=cats.filter(c=>c[0]==='oth').map(c=>'<button class="btn sec small" style="margin:8px 0 0" data-act="ltab" data-t="oth">'+c[1]+'</button>').join('');
    h+='<p class="hint" style="margin:10px 0 0">Нет в списке? Обратитесь к руководителю.</p></div>';
  }
  return h+((chosen||lr)==='cc'?'<div class="card"><a class="btn sec" href="help/instruktsiya_callcenter.pdf" target="_blank" rel="noopener">Инструкция оператора (PDF)</a></div>':(chosen==='adm'||(!chosen&&!S.notMe&&lr==='adm'))?'<div class="card"><button class="btn sec" data-act="help">Как заполнять отчёт</button></div>':'');
}
function homeTab(){const t=S.homeTab||LS.get('ev_htab');return t==='cc'?'cc':'adm'}
function homeTabs(){const t=homeTab();return '<div class="chips tabs" style="margin:0 0 10px">'+[['adm','Администраторы'],['cc','Колл-центр']].map(x=>'<button class="chip'+(t===x[0]?' on':'')+'" data-act="htab" data-t="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'}
function viewBranch(){

  if(isHead()&&!uiNew()&&homeTab()==='cc')return h+'<div class="card"><h2>Колл-центр</h2><button class="btn big" data-act="cchead">Смены и оплата операторов</button><p class="hint" style="margin:6px 0 0">Откроется раздел «Зарплата», вкладка «Колл-центр». Операторы отмечают смены сами, входя под своей фамилией.</p></div>';
  if(isHead()){h+='<div class="mrbox">'+mrHtml()+'</div>';loadMr();h+=dayStatusHtml();loadDayStatus()}
  h+='<div class="card"><h2>'+(uiNew()?'Заполнить отчёт филиала':'Где вы сегодня работаете?')+'</h2>';
  h+='<label class="f"><span>Дата отчёта</span><input type="date" id="dt" value="'+S.date+'" max="'+omskToday()+'"></label>';
  h+=BRANCHES.filter(b=>!b.testOnly).map(b=>'<button class="btn sec big" style="margin:6px 0" data-act="branch" data-id="'+b.id+'"'+(S.busy?' disabled':'')+'>'+esc(b.title)+'</button>').join('');
  h+='<button class="btn sec small" style="margin:10px 0 0" data-act="help">Как заполнять отчёт</button>';
  if(S.queue.length)h+='<p class="hint">Не отправлено отчётов: '+S.queue.length+'. Нажмите «'+(S.online?'онлайн':'нет связи')+'» вверху.</p>';
  return h+'</div>';
}
/*HELP_START*/const HELP_HTML="<p class=\"hint\">Имена и цифры на картинках вымышленные. У вас будут свои. Ниже те же шаги, что в бумажной инструкции. Кружок «?» рядом с полем объяснит каждое поле.</p><a class=\"btn sec\" style=\"display:block;text-align:center;text-decoration:none;margin:8px 0\" href=\"help/instruktsiya.pdf\" target=\"_blank\" rel=\"noopener\">Открыть PDF для печати</a><section class=\"hs\"><h3>Что это и зачем</h3><p>Раньше отчёт за день нужно было считать вручную и вносить в таблицу. Теперь его можно заполнить один раз в телефоне. Приложение само сложит суммы, проверит кассу и покажет, где что-то не сходится. Вашу зарплату за период оно тоже считает само.</p><ul><li>Вы вводите цифры так же, как раньше: вал врачей, нал и безнал, аптеку, кассу.</li><li>Приложение ничего не меняет в ваших цифрах. Оно только показывает зелёным «сходится» или красным «не сходится».</li><li>Первое время вы заполняете и старую форму, и это приложение. Это нужно, чтобы вместе убедиться, что всё работает. Ошибка в новой программе никого не наказывает.</li></ul></section><section class=\"hs\"><h3>Шаг 1. Поставьте приложение на телефон</h3><p>Приложение открывается по адресу в интернете: https://eurovetomsk-arch.github.io/eurovet-app/ . Чтобы значок был на экране, как у обычной программы, добавьте его на главный экран. Это делается один раз.</p><ul><li>iPhone: откройте адрес в браузере Safari (синий компас). Внизу нажмите кнопку «Поделиться» (квадрат со стрелкой вверх). Пролистайте список и выберите «На экран “Домой”». Нажмите «Добавить».</li><li>Android: откройте адрес в Chrome. Нажмите три точки в правом верхнем углу. Выберите «Установить приложение» или «Добавить на главный экран». Подтвердите.</li><li>Компьютер: откройте адрес в Chrome или Edge. Установка не нужна: просто добавьте страницу в закладки (Ctrl+D). Работает точно так же.</li><li>Если не получилось установить: ничего страшного. Просто открывайте адрес в браузере каждый раз. Все функции те же.</li><li>Значок с бирюзовой эмблемой появится среди приложений. Дальше открывайте приложение с него.</li></ul><div class=\"htip\">Яндекс Браузер и Samsung Internet тоже подойдут: ищите в меню браузера пункт «Добавить на главный экран».</div></section><section class=\"hs\"><h3>Шаг 2. Войдите</h3><p>PIN вам выдал Михаил. Он только ваш: никому его не говорите и не пишите на бумажках в клинике.</p><img src=\"help/02_pin.jpg\" alt=\"Пример экрана: Шаг 2. Войдите\" loading=\"lazy\"><ol class=\"hl2\"><li><b>1</b><span>Нажмите на свою фамилию. Она станет цветной.</span></li><li><b>2</b><span>Введите свой PIN: 6 цифр. Он показывается точками.</span></li><li><b>3</b><span>Нажмите «Войти».</span></li><li><b>4</b><span>Кнопка «Как заполнять отчёт»: эта инструкция открывается без PIN, если вы забыли, что куда вносить.</span></li></ol><ul><li>Выберите свою фамилию, введите PIN и нажмите «Войти».</li><li>Если ошиблись PIN 5 раз подряд, вход закроется на 15 минут. Подождите и попробуйте снова.</li><li>Забыли PIN: напишите Михаилу, он выдаст новый.</li><li>Сменить PIN на свой можно в любой момент: «Меню» → «Сменить PIN».</li></ul></section><section class=\"hs\"><h3>Шаг 3. Выберите дату и клинику</h3><p>Это нужно, чтобы отчёт попал в нужный день и в нужную клинику.</p><img src=\"help/03_branch.jpg\" alt=\"Пример экрана: Шаг 3. Выберите дату и клинику\" loading=\"lazy\"><ol class=\"hl2\"><li><b>1</b><span>Дата отчёта. По умолчанию сегодня. Если вносите отчёт за прошлый день, поставьте нужную дату (можно до 7 дней назад).</span></li><li><b>2</b><span>Нажмите на клинику, где вы работали.</span></li></ol><ul><li>Проверьте дату. Для сегодняшнего отчёта её менять не нужно.</li><li>Нажмите на название клиники.</li></ul></section><section class=\"hs\"><h3>Шаг 4. Смена и вал врачей</h3><p>Вал врача — это сумма его проведённых и полностью оплаченных счетов за день в Vetmanager. Цифры берите оттуда, откуда брали для старой формы.</p><img src=\"help/04_shift_doctors.jpg\" alt=\"Пример экрана: Шаг 4. Смена и вал врачей\" loading=\"lazy\"><ol class=\"hl2\"><li><b>1</b><span>Нажмите на себя в блоке «Смена». Если вы вошли в приложение, вы уже отмечены.</span></li><li><b>2</b><span>Время «Ушёл в» заполняйте только если ушли позже 21:00. Переработку считает приложение.</span></li><li><b>3</b><span>Нажмите на врачей, которые работали в этот день. Они станут цветными с галочкой.</span></li><li><b>4</b><span>Введите вал каждого врача из Vetmanager (в рублях).</span></li><li><b>5</b><span>Врач-замена или сумма, которой нет в списке: нажмите эту кнопку и впишите, кто это и сколько.</span></li></ol><ul><li>В блоке «Смена» должны быть отмечены вы. В смене один администратор.</li><li>В блоке «Вал врачей» отметьте работавших врачей и введите вал каждого.</li><li>Внизу блока приложение само покажет «Сумма врачей».</li></ul><div class=\"htip\">Не уверены, что значит поле? Нажмите на кружок «?» рядом с названием: появится короткое объяснение.</div></section><section class=\"hs\"><h3>Шаг 5. Клиника и аптека</h3><p>Эти числа приложение потом сверит с суммой по врачам и с оплатами. Нал и безнал вместе должны давать общий вал.</p><img src=\"help/05_clinic_pharmacy.jpg\" alt=\"Пример экрана: Шаг 5. Клиника и аптека\" loading=\"lazy\"><ol class=\"hl2\"><li><b>1</b><span>Общий вал клиники за день по Vetmanager.</span></li><li><b>2</b><span>Сколько из него оплатили наличными.</span></li><li><b>3</b><span>Сколько оплатили безналично (карты, переводы).</span></li><li><b>4</b><span>Вал аптеки за день.</span></li><li><b>5</b><span>Из него наличными.</span></li><li><b>6</b><span>Из него безналично.</span></li></ol><ul><li>Введите вал клиники, затем нал и безнал.</li><li>Введите вал аптеки, нал аптеки и безнал аптеки. Если аптека сегодня не работала, оставьте поля пустыми.</li><li>Авансы клиентов сюда не входят: для них есть отдельный блок ниже.</li></ul></section><section class=\"hs\"><h3>Шаг 6. Авансы, компенсации и сертификаты</h3><p>Если в этот день не было авансов, компенсаций и сертификатов, просто пропустите весь шаг: поля оставьте пустыми.</p><img src=\"help/06_advance_comp.jpg\" alt=\"Пример экрана: Шаг 6. Авансы, компенсации и сертификаты\" loading=\"lazy\"><ol class=\"hl2\"><li><b>1</b><span>Аванс, принятый наличными.</span></li><li><b>2</b><span>Аванс, принятый безналично.</span></li><li><b>3</b><span>Сколько из авансов ушло на оплату счетов.</span></li><li><b>4</b><span>Компенсация или бонус клиенту от клиники: в Vetmanager наличные есть, а денег в кассе нет.</span></li><li><b>5</b><span>Оплата подарочным сертификатом, в Vetmanager проходит как наличные.</span></li><li><b>6</b><span>Причина. Пишите без фамилии клиента.</span></li></ol><ul><li>Авансы вносите так, как они показаны в Vetmanager.</li><li>Блок «Компенсации и сертификаты» нужен, когда Vetmanager показал наличные, а настоящих денег в кассе нет. Сумму оставьте и в «Нал», и в авансе, как в Vetmanager: приложение само вычтет её из кассы.</li><li>Если вписали сумму, обязательно напишите причину.</li></ul></section><section class=\"hs\"><h3>Шаг 7. Касса (инкассация)</h3><p>Приложение считает, сколько наличных должно быть в кассе, и сравнивает с тем, что вы насчитали руками. Если числа разные, оно покажет, на сколько.</p><img src=\"help/07_cash.jpg\" alt=\"Пример экрана: Шаг 7. Касса (инкассация)\" loading=\"lazy\"><ol class=\"hl2\"><li><b>1</b><span>Начальная инкассация: сколько наличных лежало в кассе утром. Приложение подставляет итог вчерашнего отчёта само. Если на деле иначе, исправьте.</span></li><li><b>2</b><span>Расходы из кассы: нажмите «+ Расход».</span></li><li><b>3</b><span>Выберите статью, введите сумму и комментарий.</span></li><li><b>4</b><span>Итог инкассации: сколько наличных в кассе на самом деле сейчас. Пересчитайте деньги и введите число по факту.</span></li></ol><ul><li>Проверьте «Начальную инкассацию». Обычно она уже верная.</li><li>Добавьте все расходы за день: по одной строке на каждый. Выбираете статью, пишете сумму.</li><li>Пересчитайте наличные в кассе и введите «Итог инкассации». Не подгоняйте число под расчёт приложения: вводите то, что есть в кассе.</li><li>Расхождения не бойтесь. Это нормально: главное честно ввести факт.</li></ul><div class=\"htip\">Ошиблись и добавили лишний расход? Нажмите «Удалить расход» в этой строке.</div></section><section class=\"hs\"><h3>Шаг 8. Ассистенты и примечание</h3><p>Это нужно для расчёта доплаты ассистентам.</p><img src=\"help/08_assistants_note.jpg\" alt=\"Пример экрана: Шаг 8. Ассистенты и примечание\" loading=\"lazy\"><ol class=\"hl2\"><li><b>1</b><span>Нажмите на ассистентов, которые работали.</span></li><li><b>2</b><span>Кнопками «+» и «−» поставьте число обычных фиксаций.</span></li><li><b>3</b><span>Так же поставьте число фиксаций на рентгене.</span></li><li><b>4</b><span>Примечание: любое важное замечание по смене, например сломался принтер.</span></li></ol><ul><li>Отметьте ассистентов смены и поставьте им число фиксаций.</li><li>Если ассистент ушёл позже 21:00, впишите время.</li><li>В «Прочее» напишите, если было что-то необычное. Если нет, оставьте пустым.</li></ul></section><section class=\"hs\"><h3>Шаг 9. Проверка: зелёное и красное</h3><p>Блок «Проверка» внизу страницы показывает, сходятся ли ваши цифры друг с другом. Он только подсвечивает, а ваши числа не меняет.</p><img src=\"help/09_check_green.jpg\" alt=\"Пример экрана: Шаг 9. Проверка: зелёное и красное\" loading=\"lazy\"><ol class=\"hl2\"><li><b>1</b><span>Каждая строка проверки. Зелёная галочка: сходится.</span></li><li><b>2</b><span>Внизу слева видно итог: «Расхождений нет» или сколько красных строк.</span></li><li><b>3</b><span>Кнопка «Отправить отчёт».</span></li></ol><ul><li>Зелёная галочка: всё сходится (допуск 1 рубль).</li><li>Красный крестик: не сходится. Под строкой написано, на сколько. Сначала поищите опечатку в своих цифрах.</li><li>Серая строка: пока не хватает данных, под ней написано, чего именно.</li><li>Если красное осталось, потому что цифры верны (так бывает), напишите в «Причине расхождения», почему. Без причины отчёт с красным не отправится.</li></ul></section><section class=\"hs\"><h3>Если есть красная строка</h3><p>Красное не значит, что вы что-то сделали не так. Иногда это опечатка, иногда пересчитали позже, иногда деньги правда не сошлись. Важно написать причину.</p><img src=\"help/10_check_red.jpg\" alt=\"Пример экрана: Если есть красная строка\" loading=\"lazy\"><ol class=\"hl2\"><li><b>1</b><span>Красная строка: итог кассы не сходится, разница −500 ₽.</span></li><li><b>2</b><span>Причина расхождения. Напишите коротко и честно.</span></li></ol><ul><li>Перепроверьте цифры в блоках выше. Если нашли опечатку, исправьте: красное станет зелёным.</li><li>Если не нашли, напишите причину своими словами: «ошибся при пересчёте, пересчитаю утром» или «выдали сдачу из кассы, не записал».</li><li>Нажмите «Отправить отчёт».</li></ul></section><section class=\"hs\"><h3>Кружок «?» с подсказкой</h3><p>Рядом почти с каждым полем есть кружок с вопросом.</p><img src=\"help/11_hint.jpg\" alt=\"Пример экрана: Кружок «?» с подсказкой\" loading=\"lazy\"><ul><li>Нажмите на него: откроется объяснение, что сюда вносить и откуда брать цифру.</li><li>Чтобы закрыть, нажмите «Понятно» или в любое место вне окошка.</li></ul></section><section class=\"hs\"><h3>Шаг 10. Отправьте отчёт</h3><p>Нажмите «Отправить отчёт». Появится зелёное окно «Отчёт принят». Это значит, что отчёт сохранён и дошёл.</p><img src=\"help/12_done.jpg\" alt=\"Пример экрана: Шаг 10. Отправьте отчёт\" loading=\"lazy\"><ol class=\"hl2\"><li><b>1</b><span>«Отчёт принят» с зелёной галочкой, клиникой, датой и версией. Значит, всё сохранилось.</span></li></ol><ul><li>Если на экране написано «Отчёт принят», больше ничего делать не нужно.</li><li>Кнопка «Скопировать итоги» нужна на случай, если связь пропала: можно переслать цифры Михаилу сообщением.</li><li>Кнопка «Готово» возвращает на начало.</li></ul></section><section class=\"hs\"><h3>Если пропал интернет</h3><p>Вверху справа есть значок «онлайн» (зелёная точка) или «нет связи» (красная).</p><img src=\"help/14_offline.jpg\" alt=\"Пример экрана: Если пропал интернет\" loading=\"lazy\"><ul><li>Ничего не потеряется: отчёт сохранится на телефоне и сам отправится, когда связь вернётся.</li><li>Пока отчёт не ушёл, вверху будет написано «ждёт: 1». Нажмите на эту надпись, чтобы посмотреть.</li><li>Откройте приложение, когда связь появится, и подождите несколько секунд: отчёт уйдёт сам.</li></ul></section><section class=\"hs\"><h3>Как исправить отправленный отчёт</h3><p>Ошибиться не страшно. Отчёт можно исправить в любой момент, старая версия при этом остаётся в истории.</p><ul><li>Войдите, выберите ту же дату и ту же клинику. Откроется отчёт с вашими прежними цифрами и пометкой, что он уже сдан.</li><li>Исправьте нужные цифры.</li><li>В блоке «Проверка» заполните «Причину исправления отчёта»: коротко, что поменяли и почему.</li><li>Нажмите «Отправить отчёт». Появится «версия 2».</li></ul></section><section class=\"hs\"><h3>Меню</h3><p>Кнопка «Меню» вверху справа.</p><img src=\"help/13_menu.jpg\" alt=\"Пример экрана: Меню\" loading=\"lazy\"><ul><li>«Как заполнять отчёт»: эта инструкция, всегда под рукой.</li><li>«Сменить PIN»: поставьте свой новый PIN из 6 цифр.</li><li>«Выйти»: выйти из приложения. Если телефон только ваш, выходить не обязательно.</li><li>Внизу меню написана версия приложения: если вам нужно что-то спросить, назовите её.</li></ul></section><section class=\"hs\"><h3>Частые вопросы</h3><p><b>Я ввёл цифру неправильно, а уже перешёл дальше.</b><br>Пролистайте вверх и исправьте. Приложение пересчитывает всё само.</p><p><b>Закрыл приложение, не отправив. Всё пропало?</b><br>Нет. Введённые цифры сохраняются на телефоне. При входе приложение предложит восстановить черновик.</p><p><b>Не хватает врача или ассистента в списке.</b><br>Для врача-замены нажмите «+ Врач-замена…» в блоке «Вал врачей». Если человека нет в списках постоянно, напишите Михаилу.</p><p><b>Приложение показывает красное, а я уверен, что всё верно.</b><br>Напишите причину и отправьте. Красное никого не наказывает: Михаил увидит и разберётся.</p><p><b>Вчерашний итог кассы подставился неправильный.</b><br>Исправьте «Начальную инкассацию» вручную. Приложение подсветит разницу, и Михаил её разберёт.</p><p><b>Нужно внести отчёт за прошлый день.</b><br>На втором экране поставьте нужную дату (до 7 дней назад) и выберите клинику.</p></section><section class=\"hs\"><h3>Первое время: два отчёта сразу</h3><ul><li>Сейчас вы заполняете отчёт в двух местах: по-старому и в этом приложении. Это временно. Когда убедимся, что всё работает без сбоев, Михаил скажет, что старую форму можно отключить.</li><li>Если в приложении что-то получилось не так, это нормально. Для этого мы и работаем параллельно. Красные строки нужны, чтобы вместе быстро найти причину, а не чтобы кого-то ругать.</li><li>Первое задание: внести в приложение отчёты за 16–24 октября за смены, которые вы отработали. По каждой дате отдельно, начиная с 16-го.</li></ul></section><section class=\"hs\"><h3>Обратная связь</h3><ul><li>Пишите Михаилу всё, что мешает или чего не хватает: «кнопка не там», «непонятная подсказка», «хочу, чтобы это считалось само».</li><li>Приложение дорабатывается быстро, вместе с искусственным интеллектом. Ваше замечание может превратиться в улучшение уже на следующей неделе.</li><li>Если что-то сломалось, пришлите скриншот и версию приложения (она внизу меню).</li></ul></section><section class=\"hs\"><h3>Памятка: всё ли вы сделали</h3><ul class=\"hchk\"><li>Вошёл, выбрал дату и клинику.</li><li>Отметил смену, врачей, ввёл вал каждого.</li><li>Ввёл клинику и аптеку: общий вал, нал, безнал.</li><li>Ввёл авансы, компенсации, сертификаты (если были).</li><li>Проверил начало кассы, добавил расходы, ввёл итог инкассации по факту.</li><li>Отметил ассистентов и фиксации.</li><li>Проверил «Проверку»: зелёное или написана причина.</li><li>Нажал «Отправить отчёт», увидел «Отчёт принят».</li></ul></section>";
/*HELP_END*/

function viewBar(){
  return '<div class="bar"><div class="in"><div class="st" id="barst" data-act="tochecks"></div><button class="btn" data-act="submit">Отправить отчёт</button></div></div>';
}
function updateChecks(){
  if(S.view!=='form')return;
  const calc=compute();
  const el=$('#checks');
  if(el)el.innerHTML=calc.checks.map(c=>{
    const cls=!c.ready?'wait':(c.ok?'ok':'bad');
    const mark=!c.ready?'…':(c.ok?'✓':'✗');
    const diff=c.ready&&!c.ok?'<br><b>Разница: '+money(c.diff)+'</b>':'';
    return '<div class="chk '+cls+'"><i>'+mark+'</i><div>'+esc(c.label)+(c.ready?'<br><small>'+esc(c.detail)+'</small>':(c.miss?'<small class="need">Не хватает: '+esc(c.miss)+'</small>':''))+diff+'</div></div>';
  }).join('');
  const set=(id,t)=>{const e=$(id);if(e)e.textContent=t};
  set('#s-docs',money(calc.sumDocs));set('#s-exp',money(calc.exp));set('#s-expn',money(calc.expNc));{const r=$('#s-expn-row');if(r)r.hidden=!(calc.expNc>0)}set('#s-exp2',money(calc.expected));
  const bad=calc.checks.filter(c=>c.ready&&!c.ok).length;
  const st=$('#barst');
  if(st)st.innerHTML=bad?'<b style="color:var(--bad)">Расхождений: '+bad+'</b>':(calc.checks.some(c=>c.ready)?'<b style="color:var(--ok)">Расхождений нет</b>':'<span style="color:var(--mute)">Заполните отчёт</span>');
}
function viewDone(){
  const d=S.done;
  const it=S.queue.find(x=>x.uid===d.uid)||{};const st=it.status||'';
  const needR=!d.sent&&st==='needs_reason';
  let h='<div class="card"><h2>'+(d.sent?'Отчёт принят':needR?'Нужна причина исправления':'Отчёт сохранён на устройстве')+'</h2>';
  if(d.sent){
    h+='<div class="chk ok"><i>✓</i><div>'+esc(d.branch)+' · '+ruDate(d.date)+(d.version?' · версия '+d.version:'')+'</div></div>';
    h+='<div id="flagbox">'+flagsHtml()+'</div>';
  }else if(needR){
    h+='<div class="chk warn"><i>!</i><div>За '+ruDate(d.date)+' ('+esc(d.branch)+') отчёт уже сдан. Этот будет исправлением. Впишите, что исправили и почему, и отправьте.</div></div>'
      +'<label class="f"><span>Причина исправления</span><input id="rs-'+it.uid+'" autocomplete="off"></label>'
      +'<button class="btn" data-act="setReason" data-id="'+it.uid+'" style="margin:0 0 8px">Отправить с причиной</button>';
  }else if(st==='error'){

  }else if(st==='need_login'){

  }

/* ведомость: один человек = одна строка с расшифровкой (если он и админ, и ассистент — суммы складываются) */
function payList(r){
  const rt=r.rates||{},pc=Math.round(Number(rt.admin_pharmacy_pct)*10000)/100;
  const m=new Map();
  const get=a=>{const k=a.id!=null?a.id:a.name;let o=m.get(k);if(!o){o={name:a.name,roles:[],total:0,items:[]};m.set(k,o)}return o};
  const role=(o,x)=>{if(!o.roles.includes(x))o.roles.push(x)};
  const adj=(o,a)=>(a.adj_items||[]).filter(i=>!i.is_cancel&&!i.cancelled).forEach(i=>o.items.push({l:(SAL_KIND[i.kind]||i.kind)+' '+ruDate(i.date)+(i.comment?' · '+i.comment:''),v:Number(i.amount),sg:true}));
  (r.admins||[]).forEach(a=>{const o=get(a);o.total+=Number(a.total||0);role(o,'администратор');
    o.items.push({l:'За смены: '+a.shifts+' × '+money(Number(a.shift_rate)),v:Number(a.shift_pay)});
    o.items.push({l:'Процент '+pc+'% от выручки аптеки ('+money(Number(a.pharm_val))+')',v:Number(a.pct_pay)});
    o.items.push({l:Number(a.late_hours)>0?'Переработка: '+a.late_hours+' ч × '+money(Number(rt.hour)):'Переработка: нет',v:Number(a.late_pay)});
    adj(o,a)});
  (r.assistants||[]).forEach(a=>{const o=get(a);o.total+=Number(a.total||0);role(o,'ассистент');
    o.items.push({l:'За смены: '+a.shifts,v:Number(a.shift_pay)});
    o.items.push({l:'Фиксации: обычные '+a.fix_normal+' × '+money(Number(rt.fix_normal))+', рентген '+a.fix_xray+' × '+money(Number(rt.fix_xray)),v:Number(a.fix_pay)});
    adj(o,a)});
  (r.callcenter||[]).forEach(a=>{if(!Number(a.shifts||0)&&!(a.adj_items||[]).some(i=>!i.is_cancel&&!i.cancelled))return;const o=get(a);o.total+=Number(a.total||0);role(o,'колл-центр');
    o.items.push({l:'За выходы: '+a.shifts+' × '+money(Number(a.shift_rate)),v:Number(a.shift_pay)});
    o.items.push({l:'Доля фонда периода по дням смен'+((r.cc_days||[]).some(d=>d.provisional)?' (предварительно)':''),v:Number(a.pct_pay)});
    adj(o,a)});
  (r.extra||[]).forEach(a=>{if(!Number(a.total||0)&&!(a.adj_items||[]).some(i=>!i.is_cancel&&!i.cancelled))return;const o=get(a);o.total+=Number(a.total||0);role(o,'только добавки');adj(o,a)});
  const ord=o=>o.roles.includes('администратор')?0:o.roles.includes('ассистент')?1:o.roles.includes('колл-центр')?2:3;
  return [...m.values()].map(o=>({name:o.name,role:o.roles.join(' и '),total:o.total,items:o.items,_o:ord(o)})).sort((a,b)=>a._o-b._o||a.name.localeCompare(b.name,'ru'));
}
function payText(r,g){
  const rr=g==='adm'?Object.assign({},r,{assistants:[],extra:[],callcenter:[]}):g==='ast'?Object.assign({},r,{admins:[],extra:[],callcenter:[]}):g==='cc'?Object.assign({},r,{admins:[],assistants:[],extra:[]}):r;
  const ttl=g==='adm'?' (администраторы)':g==='ast'?' (ассистенты)':g==='cc'?' (колл-центр)':'';
  if(g==='add'){
    const al=(r.adj||[]).filter(i=>!i.is_cancel&&!i.cancelled);
    return 'Добавки '+ruDate(r.from)+' — '+ruDate(r.to)+'\n'+(al.length?al.map(i=>i.name+' — '+(SAL_KIND[i.kind]||i.kind)+' '+ruDate(i.date)+(i.comment?' · '+i.comment:'')+' — '+sgn(Number(i.amount))).join('\n'):'нет');
  }
  if(g==='cc'){
    const L=r.callcenter||[],rt=r.cc_rates||{};
    return 'Колл-центр '+ruDate(r.from)+' — '+ruDate(r.to)+'\n'+L.map(a=>a.name+' — '+money(Number(a.total))+'\n   Выходов: '+a.shifts+' × '+money(Number(a.shift_rate))+' — '+money(Number(a.shift_pay))+'\n   Доля фонда периода'+((r.cc_days||[]).some(d=>d.provisional)?' (предварительно)':'')+' — '+money(Number(a.pct_pay))+(a.adj_items||[]).filter(i=>!i.is_cancel&&!i.cancelled).map(i=>'\n   '+(SAL_KIND[i.kind]||i.kind)+' '+ruDate(i.date)+' — '+sgn(Number(i.amount))).join('')).join('\n')+'\nВсего: '+money(L.reduce((q,a)=>q+Number(a.total||0),0))+'\n(фонд = '+(Math.round(Number(rt.cc_pct_pool||0)*10000)/100)+'% вала клиник периода ÷ календарные дни; день: одному целиком, двоим пополам'+((r.cc_days||[]).some(d=>d.provisional)?'; период не закрыт, цифры предварительные':'')+')';
  }
  const pay=payList(rr);
  const all=pay.reduce((s,p)=>s+p.total,0);
  return 'Зарплата'+ttl+' '+ruDate(r.from)+' — '+ruDate(r.to)+'\n'+pay.map(p=>p.name+' ('+p.role+') — '+money(p.total)+p.items.map(i=>'\n   '+i.l+' — '+(i.sg?sgn(i.v):money(i.v))).join('')).join('\n')+'\nВсего: '+money(all);
}

/* 1.48: врачи, оклады и постоянные доплаты в «Зарплата»: берутся из ведомости за период целиком (ev_payroll_statement) */
function salPayRange(f,t){
  const today=omskToday();
  if(!f||!t||f<PAY_START||perStart(f)!==f)return null;
  if(t===perEnd(f)||(f===perStart(today)&&t===today))return[f,perEnd(f)];
  return null;
}
async function loadSalPay(f,t){
  S.salPay=null;S.salPayKey=null;S.salPayErr=null;
  const rg=salPayRange(f,t);if(!rg)return;
  const key=f+'|'+t;S.salPayKey=key;S.salPayLoad=true;
  try{
    const r=await rpc('ev_payroll_statement',{p_token:S.token,p_from:rg[0],p_to:rg[1]},20000);
    if(S.salPayKey!==key)return;
    if(r&&r.ok)S.salPay=r;else S.salPayErr='Не удалось загрузить врачей';
  }catch(e){if(S.salPayKey!==key)return;S.salPayErr=e.net?'Нет связи: врачи не загружены.':'Ошибка сервера: врачи не загружены.'}
  S.salPayLoad=false;if(S.view==='sal')paint();
}
function salPayInfo(){
  const r=S.salPay,sl=S.sal;
  if(!r||!sl||S.salPayKey!==S.salFrom+'|'+S.salTo)return null;
  const tt=sl.totals||{},base=Number(tt.admins||0)+Number(tt.assistants||0)+Number(tt.callcenter||0)+Number(tt.extra||0);
  const docs=(r.rows||[]).filter(x=>x.parts&&Number(x.parts.doctor)).map(x=>({name:x.name,doctor:Number(x.parts.doctor||0),sur:Number(x.parts.surcharge||0)}));
  const docSum=docs.reduce((a,x)=>a+x.doctor+x.sur,0),total=Number(r.total.accrued||0),rest=Math.round((total-docSum-base)*100)/100;
  const own=new Set((sl.warnings||[]).map(String));
  return{docs,docSum,total,paid:Number(r.total.paid||0),toPay:Number(r.total.to_pay||0),rest,warns:(r.warnings||[]).filter(w=>!own.has(String(w))),prov:!!r.provisional};
}

function mergeStatements(rs,list){

      o.accrued+=N(x.accrued);o.paid+=N(x.paid);o.paid_card+=N(x.paid_card);o.paid_cash+=N(x.paid_cash);o.paid_adv+=N(x.paid_adv);o.to_pay+=N(x.to_pay);

}

function copyPayroll(){
  const r=S.pay;if(!r)return;
  const L=['Ведомость '+ruDate(r.from)+' — '+ruDate(r.to)+(r.provisional?' (предварительно)':''),'Сотрудник; начислено; выплачено; остаток к выплате'];
  (r.rows||[]).forEach(x=>L.push(x.name+'; '+Number(x.accrued)+'; '+Number(x.paid)+'; '+Number(x.to_pay)));
  L.push('ИТОГО; '+Number(r.total.accrued)+'; '+Number(r.total.paid)+'; '+Number(r.total.to_pay));
  const txt=L.join('\n');
  try{navigator.clipboard.writeText(txt).then(()=>toast('Скопировано'),()=>toast('Не удалось скопировать'))}catch(e){toast('Не удалось скопировать')}
}

/* ====== Выручка и зарплата за день по филиалу: только руководитель, из последних версий отчётов ====== */
function dayPays(r){
  const rt=r.rates||{},o=[],hr=Number(rt.admin_shift)/12;
  (r.admins||[]).forEach(a=>(a.days||[]).forEach(d=>{const lh=Number(d.late_hours)||0;o.push({b:d.branch,date:d.date,id:a.id,name:a.name,kind:'adm',late:lh,pay:Number(rt.admin_shift)+Number(d.pharm||0)*Number(rt.admin_pharmacy_pct)+lh*hr})}));
  (r.assistants||[]).forEach(a=>(a.days||[]).forEach(d=>{const fn=Number(d.fix_normal)||0,fx=Number(d.fix_xray)||0;o.push({b:d.branch,date:d.date,id:a.id,name:a.name,kind:'ast',fn:fn,fx:fx,pay:Number(d.rate||0)+fn*Number(rt.fix_normal)+fx*Number(rt.fix_xray)})}));
  return o;
}
function staffOf(sal,bid){
  if(!sal)return null;
  const map=new Map();
  dayPays(sal).filter(p=>p.b===bid).forEach(p=>{const k=p.kind+':'+p.id;let o=map.get(k);if(!o){o={kind:p.kind,name:p.name,pay:0,n:0,late:0,fn:0,fx:0};map.set(k,o)}o.pay+=p.pay;o.n++;o.late+=p.late||0;o.fn+=p.fn||0;o.fx+=p.fx||0});
  return [...map.values()].sort((a,b)=>(a.kind==='adm'?0:1)-(b.kind==='adm'?0:1)||a.name.localeCompare(b.name,'ru'));
}
function revAgg(reps){
  const a={n:reps.length,total:0,cash:0,cashless:0,pv:0,pc:0,pl:0,debt:0,repaid:0,dc:[],docs:new Map()};
  reps.forEach(r=>{a.total+=Number(r.total);a.cash+=Number(r.cash);a.cashless+=Number(r.cashless);a.pv+=Number(r.pharm_val);a.pc+=Number(r.pharm_cash);a.pl+=Number(r.pharm_cashless);a.debt+=Number(r.debt||0);a.repaid+=Number(r.repaid||0);if(r.debt_comment)a.dc.push(r.debt_comment);
    (r.doctors||[]).forEach(d=>a.docs.set(d.name,(a.docs.get(d.name)||0)+Number(d.val)))});
  return a;
}

  const last=reps[0];

function setPath(o,p,v){const k=p.split('.');let t=o;for(let i=0;i<k.length-1;i++){if(t[k[i]]==null)t[k[i]]={};t=t[k[i]]}t[k[k.length-1]]=v}
function getPath(o,p){return p.split('.').reduce((t,k)=>t==null?t:t[k],o)}

document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.p||!S.form)return;
  if(t.inputMode==='decimal'){
    const pos=t.selectionStart==null?t.value.length:t.selectionStart;
    const keep=t.value.slice(0,pos).replace(/[^\d.,]/g,'').length;
    const nv=fmtNum(t.value);
    if(nv!==t.value){
      t.value=nv;
      let c=0,np=0;while(np<nv.length&&c<keep){if(/[\d.,]/.test(nv.charAt(np)))c++;np++}
      try{t.setSelectionRange(np,np)}catch(e){}
    }
  }
  setPath(S.form,t.dataset.p,t.value);
  if(t.inputMode==='decimal'){const v=num(t.value);t.classList.toggle('bad',isNaN(v))}
  saveDraft();updateChecks();
});

/* ====== 1.69: «Ручная загрузка руководителя» (меню → только руководитель). Начисления врачей из Vetmanager (xls), выплаты банка, выдача PIN ====== */
/*MU-PARSE-BEGIN*/
const MU_LAT={A:'А',a:'а',B:'В',C:'С',c:'с',E:'Е',e:'е',H:'Н',K:'К',k:'к',M:'М',O:'О',o:'о',P:'Р',p:'р',T:'Т',X:'Х',x:'х',y:'у'};
const muWords=s=>String(s==null?'':s).replace(/[AaBCcEeHKkMOoPpTXxy]/g,c=>MU_LAT[c]).replace(/ё/g,'е').replace(/Ё/g,'Е').toLowerCase().match(/[а-я]+/g)||[];
const muKey=s=>{const t=muWords(s);return t.length>1?t[0]+'|'+t[1][0]:t.length?t[0]+'|':null};
function muIndex(people){const m={};(people||[]).forEach(p=>{[p.full_name,p.short_name].forEach(n=>{const k=n?muKey(n):null;if(k){(m[k]=m[k]||new Set()).add(p.id)}})});return m}
function muMatch(idx,fio){const ids=idx[muKey(fio)];if(!ids||!ids.size)return{err:'нет в списке сотрудников'};if(ids.size>1)return{err:'несколько совпадений'};return{id:[...ids][0]}}
const muR2=x=>Math.round(x*100)/100;
const muPeriodEnd=d=>Number(d.slice(8,10))<=15?d.slice(0,8)+'15':new Date(Date.UTC(Number(d.slice(0,4)),Number(d.slice(5,7)),0)).toISOString().slice(0,10);
const muPeriodStart=d=>Number(d.slice(8,10))<=15?d.slice(0,8)+'01':d.slice(0,8)+'16';
const muPeriodOk=(f,t)=>/^\d{4}-\d{2}-\d{2}$/.test(f)&&/^\d{4}-\d{2}-\d{2}$/.test(t)&&muPeriodStart(f)===f&&muPeriodEnd(f)===t;
/* rows2d: массив строк листа (массивы ячеек). Ожидаются колонки «Период», «ФИО», «Сумма ЗП». */
function muParseVM(rows2d,idx){
  const out={period:null,rows:[],issues:[],total:0,fatal:null};
  if(!rows2d||!rows2d.length){out.fatal='Файл пустой';return out}
  const head=(rows2d[0]||[]).slice(0,3).map(x=>String(x==null?'':x).trim());
  if(head[0]!=='Период'||head[1]!=='ФИО'||head[2]!=='Сумма ЗП'){out.fatal='Это не файл начислений Vetmanager: ожидаются колонки «Период», «ФИО», «Сумма ЗП». Нашёл: '+head.join(' | ');return out}
  const periods=new Set(),seen=new Set();
  rows2d.slice(1).forEach(r=>{
    const per=String(r[0]==null?'':r[0]).trim(),fio=String(r[1]==null?'':r[1]).trim(),amt=r[2];
    if(!per&&!fio&&(amt===''||amt==null))return;
    const m=/^(\d{4}-\d{2}-\d{2})\s*-\s*(\d{4}-\d{2}-\d{2})$/.exec(per);
    if(!m){out.issues.push('«'+fio+'»: период не распознан ('+per+')');return}
    periods.add(m[1]+'|'+m[2]);
    if(typeof amt!=='number'||!isFinite(amt)){out.issues.push(fio+': сумма не число ('+amt+')');return}
    if(amt<0)out.issues.push(fio+': отрицательная сумма '+amt);
    const mt=muMatch(idx,fio);
    if(mt.err){out.issues.push(fio+': '+mt.err+' (строка пропущена)');return}
    if(seen.has(mt.id)){out.issues.push(fio+': дубль строки в файле (пропущена)');return}
    seen.add(mt.id);out.rows.push({person_id:mt.id,amount:muR2(amt),name_in_file:fio});
  });
  if(periods.size!==1){out.fatal='В файле '+(periods.size?'несколько периодов: '+[...periods].join('; '):'нет распознанных периодов');return out}
  const p=[...periods][0].split('|');out.period=p;
  if(!muPeriodOk(p[0],p[1]))out.fatal='Период '+p[0]+' — '+p[1]+' не 1–15 и не 16–конец месяца';
  out.total=muR2(out.rows.reduce((s,r)=>s+r.amount,0));
  return out;
}
const muNum=s=>{const t=String(s==null?'':s).replace(/[\s ]/g,'').replace(',','.');return/^-?\d+(\.\d+)?$/.test(t)?Number(t):null};
const MU_FIO=/[А-ЯЁA-Z][а-яёa-z\-]+(?:\s+[А-ЯЁA-Z][а-яёa-z\-]+){1,2}/;
const MU_DATE=/(\d{2})[.\-\/](\d{2})[.\-\/](\d{4})|(\d{4})-(\d{2})-(\d{2})/;
const MU_CARD=/\b\d{13,20}\b/;
function muIso(s){const m=MU_DATE.exec(s||'');if(!m)return null;return m[1]?m[3]+'-'+m[2]+'-'+m[1]:m[4]+'-'+m[5]+'-'+m[6]}
/* Текст реестра банка: START;ддммгггг;...;CREDIT / счёт;сумма;ФИО;СНИЛС;1 / END;строк;сумма;RUR; либо 1С; либо таблица. Номера счетов и карт не сохраняются. */
function muParseBankText(text){
  const res={rows:[],issues:[],format:''};
  const T=String(text).replace(/^﻿/,'');
  if(/^\s*START;/.test(T)){
    res.format='банк (START/END)';
    const L=T.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    const st=L[0].split(';'),en=L[L.length-1].split(';'),d=st[1]||'';
    const date=/^\d{8}$/.test(d)?d.slice(4)+'-'+d.slice(2,4)+'-'+d.slice(0,2):null;
    L.slice(1,-1).forEach(l=>{const c=l.split(';');res.rows.push({fio:(c[2]||'').trim(),amount:muNum(c[1]),date})});
    const cnt=Number(en[1]),tot=muNum(en[2]);
    const ssum=muR2(res.rows.reduce((s,r)=>s+(r.amount||0),0));
    if(en[0]!=='END')res.issues.push('Нет строки END в конце файла');
    else if(res.rows.length!==cnt||(tot!=null&&Math.abs(ssum-tot)>0.005))res.issues.push('Итог файла не сходится: строк '+res.rows.length+' (в END '+cnt+'), сумма '+ssum+' (в END '+tot+')');
    return res;
  }
  if(/СекцияДокумент/.test(T)){
    res.format='1С';
    (T.match(/СекцияДокумент[\s\S]*?КонецДокумента/g)||[]).forEach(blk=>{
      const d={};blk.split(/\r?\n/).forEach(l=>{const i=l.indexOf('=');if(i>0)d[l.slice(0,i)]=l.slice(i+1)});
      const pur=d['НазначениеПлатежа']||'',name=d['Получатель']||d['Получатель1']||'';
      const m=MU_FIO.exec(name)||MU_FIO.exec(pur);
      res.rows.push({fio:m?m[0]:name.trim(),amount:muNum(d['Сумма']),date:muIso(d['ДатаПлатежа']||d['ДатаДокумента']||d['Дата'])});
    });
    return res;
  }
  res.format='таблица';
  const lines=T.split(/\r?\n/).filter(l=>l.trim());
  const delim=[';','\t','|'].find(c=>lines.slice(0,20).every(l=>l.includes(c)))||',';
  lines.forEach(l=>{
    const cells=(l.split(delim).length>1?l.split(delim):l.split(/\s{2,}/)).map(c=>c.trim().replace(/^"|"$/g,''));
    const fc=cells.find(c=>MU_FIO.test(c));if(!fc)return;
    const fio=MU_FIO.exec(fc)[0];
    const cand=cells.filter(c=>/^[\d\s .,]+$/.test(c)&&!MU_CARD.test(c.replace(/\s/g,''))&&!MU_DATE.test(c)&&muNum(c)!=null);
    const dec=cand.filter(c=>/[.,]\d{1,2}$/.test(c)).map(muNum);
    const nums=dec.length?dec:cand.map(muNum);
    res.rows.push({fio,amount:nums.length?Math.max(...nums):null,date:muIso(l)});
  });
  return res;
}
function muMatchBank(rows,idx){
  return rows.map(r=>{
    const o={fio:r.fio,amount:r.amount,date:r.date,person_id:null,err:null};
    if(r.amount==null||!(r.amount>0))o.err='сумма не распознана';
    else{const m=muMatch(idx,r.fio);if(m.err)o.err=m.err;else o.person_id=m.id}
    return o;
  });
}
/* Период по умолчанию для выплаты: последний ЗАКОНЧИВШИЙСЯ до даты платежа */
function muDefaultPeriod(payDate){
  const s=muPeriodStart(payDate);
  const prevEnd=new Date(Date.UTC(Number(s.slice(0,4)),Number(s.slice(5,7))-1,Number(s.slice(8,10))-1)).toISOString().slice(0,10);
  const f=muPeriodStart(prevEnd);return[f,muPeriodEnd(f)];
}
function muPrevPeriods(today,n){const out=[];let s=muPeriodStart(today);for(let i=0;i<n;i++){const prevEnd=new Date(Date.UTC(Number(s.slice(0,4)),Number(s.slice(5,7))-1,Number(s.slice(8,10))-1)).toISOString().slice(0,10);s=muPeriodStart(prevEnd);out.push([s,muPeriodEnd(s)])}return out}
const muGuessBranch=n=>/маркс|marks/i.test(n)?'marksa':/перел|perel/i.test(n)?'pereleta':/70|октябр/i.test(n)?'70let':'';
function muDecode(buf){
  const u=new Uint8Array(buf);
  for(const enc of['utf-8','windows-1251','ibm866']){try{return{text:new TextDecoder(enc,{fatal:true}).decode(u),enc}}catch(e){}}
  return{text:new TextDecoder('windows-1251').decode(u),enc:'windows-1251?'};
}
function muRandPin(){
  for(;;){
    const a=new Uint32Array(6);crypto.getRandomValues(a);const p=Array.from(a,x=>x%10).join('');
    if(/^(\d)\1{5}$/.test(p))continue;
    if('0123456789'.includes(p)||'9876543210'.includes(p))continue;
    return p;
  }
}
/* «Состояние системы»: пороги в часах. Красное = давно не было события. */
function muHealthRows(h,nowMs,tt){tt=tt||(x=>x);
  const age=t=>t?Math.max(0,(nowMs-new Date(t).getTime())/36e5):null;
  const row=(label,t,lim,note)=>{const a=age(t);return{label,age:a,lim,bad:a==null||a>lim,note:note||''}};

}
const muAgeTxt=a=>a==null?'нет данных':a<1?'меньше часа назад':a<48?Math.round(a)+' ч назад':Math.round(a/24)+' дн назад';
/*MU-PARSE-END*/
const muF=n=>Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const MU_ERR={session:'Сессия закончилась. Войдите заново.',forbidden:'Раздел только для руководителя.',duplicate_file:'Этот файл уже загружен.',period_or_kind:'Период должен быть 1–15 или 16–конец месяца.',before_start:'Учёт в системе начинается с 16.10.2026.',row:'В файле есть сотрудник, которого нет в списке.',duplicate_person:'Один сотрудник дважды в файле.',branch:'Выберите филиал.',branch_already_loaded:'По этому филиалу и периоду файл уже загружен. Сначала отмените прежнюю загрузку.',input:'Файл не прошёл проверку.',pin_format:'PIN: ровно 6 цифр.',person:'Сотрудник не найден.'};
const muBrTitle=id=>(BRANCHES.find(b=>b.id===id)||{title:id||'—'}).title;
function muLoadX(){

async function muSha(buf){
  if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');
  return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',buf)),b=>b.toString(16).padStart(2,'0')).join('');

async function muLoadVMFile(i){

async function muPickBank(input){
  const file=(input.files||[])[0];input.value='';
